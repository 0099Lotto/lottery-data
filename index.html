<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星辰路引</title>
<meta name="description" content="星辰路引 —— 開獎資料整理與版路比對工具">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   星辰路引 - 網頁版樣式
   設計概念:夜空版路圖 —— 深空背景 + 金色星光主色,
   輔以原始 App 版路圖中的天藍、玫瑰粉作點綴色。
   ============================================================ */

:root {
  --void: #0a0e1a;
  --void-2: #121a30;
  --nebula: #161d33;
  --nebula-2: #1b2340;
  --star-gold: #e8b84b;
  --star-gold-soft: rgba(232, 184, 75, 0.35);
  --comet-rose: #e8879a;
  --sky-thread: #6fa8c9;
  --ember: #d65b4a;
  --ink: #edeff5;
  --ink-dim: #8b92a8;
  --line: rgba(237, 239, 245, 0.1);

  --font-display: 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
  --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;

  --radius: 14px;
  --container-w: 560px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 72px;
}

.starfield {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: var(--void);
  background-image:
    radial-gradient(1.5px 1.5px at 8% 15%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 22% 8%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 35% 22%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 48% 6%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 62% 18%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 75% 9%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 88% 24%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 15% 40%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 30% 55%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 68% 45%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 82% 60%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 92% 75%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 12% 70%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 45% 80%, rgba(255,255,255,.3), transparent 60%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 55%, var(--nebula) 100%);
  background-repeat: no-repeat;
  background-size: cover;
}

/* ---------- Hero ---------- */
.hero {
  width: 100%;
  max-width: var(--container-w);
  text-align: center;
  padding: 40px 24px 8px;
}

.hero__constellation {
  width: 200px;
  height: 80px;
  margin: 0 auto 4px;
  display: block;
  opacity: 0.9;
}
.hero__constellation circle { fill: var(--star-gold); }
.hero__constellation line { stroke: var(--star-gold); stroke-width: 0.6; opacity: 0.5; }

.hero__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0.08em;
  margin: 4px 0 10px;
  background: linear-gradient(135deg, var(--star-gold) 0%, #f6d98a 50%, var(--star-gold) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

.hero__tagline {
  font-size: 14px;
  color: var(--ink-dim);
  margin: 0;
  line-height: 1.6;
}

/* ---------- Lotto picker ---------- */
.lotto-picker {
  width: 100%;
  max-width: var(--container-w);
  display: flex;
  gap: 8px;
  padding: 20px 20px 0;
  flex-wrap: wrap;
  justify-content: center;
}

.lotto-picker__btn {
  flex: 1 1 auto;
  min-width: 74px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--nebula);
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.lotto-picker__btn.is-active { border-color: var(--star-gold); color: var(--star-gold); background: var(--nebula-2); }
.lotto-picker__btn:hover { color: var(--ink); }

/* ---------- Tabs ---------- */
.tabs {
  width: 100%;
  max-width: var(--container-w);
  display: flex;
  gap: 4px;
  padding: 18px 20px 0;
  border-bottom: 1px solid var(--line);
}

.tabs__btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 10px 4px 12px;
  cursor: pointer;
  position: relative;
  transition: color .15s ease;
}
.tabs__btn.is-active { color: var(--ink); }
.tabs__btn.is-active::after {
  content: '';
  position: absolute;
  left: 10%; right: 10%; bottom: -1px;
  height: 2px;
  background: var(--star-gold);
  border-radius: 2px;
}

/* ---------- Panel ---------- */
.panel {
  width: 100%;
  max-width: var(--container-w);
  padding: 22px 20px 20px;
  flex: 1;
}
.tab-content[hidden] { display: none; }

.section-label { font-size: 13px; color: var(--ink-dim); margin: 22px 0 10px; }
.section-label:first-child { margin-top: 0; }

.empty-note {
  font-size: 13px;
  color: var(--ink-dim);
  background: var(--nebula);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin: 0;
  line-height: 1.7;
}

/* ---------- Upload card ---------- */
.upload-card {
  border: 1.5px dashed var(--star-gold-soft);
  border-radius: var(--radius);
  padding: 36px 20px;
  text-align: center;
  background: var(--nebula);
  transition: border-color .15s ease, background .15s ease;
}
.upload-card.is-dragging { border-color: var(--star-gold); background: var(--nebula-2); }
.upload-card__title { font-size: 15px; color: var(--ink); margin: 0 0 10px; }
.upload-card__hint { font-size: 12.5px; color: var(--ink-dim); line-height: 1.7; margin: 0 0 18px; }

.upload-btn {
  display: inline-block;
  padding: 11px 22px;
  border-radius: 999px;
  background: var(--star-gold);
  color: var(--void);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: filter .15s ease;
}
.upload-btn:hover { filter: brightness(1.08); }
.upload-btn--ghost { background: none; border: 1px solid var(--line); color: var(--ink-dim); margin-top: 18px; font-weight: 500; }

/* ---------- Stat row ---------- */
.stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--nebula); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.stat__value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat__label { font-size: 11.5px; color: var(--ink-dim); }

/* ---------- Draw table ---------- */
.draw-table { display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--nebula); }
.draw-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.draw-row:last-child { border-bottom: none; }
.draw-row__date { font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.draw-row__balls { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }

.ball {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--star-gold-soft);
  color: var(--ink);
  background: var(--void-2);
}
.ball--special { border-color: var(--comet-rose); color: var(--comet-rose); }

/* ---------- Mode grid ---------- */
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.mode-btn {
  padding: 12px 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--nebula);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.mode-btn.is-active { border-color: var(--sky-thread); background: var(--nebula-2); color: var(--sky-thread); }

/* ---------- Segmented control ---------- */
.segmented { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.segmented__btn {
  flex: 1;
  padding: 10px 4px;
  background: var(--nebula);
  border: none;
  border-right: 1px solid var(--line);
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 12.5px;
  cursor: pointer;
}
.segmented__btn:last-child { border-right: none; }
.segmented__btn.is-active { background: var(--star-gold); color: var(--void); font-weight: 600; }

/* ---------- Date input ---------- */
.date-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--nebula);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  color-scheme: dark;
}

/* ---------- Run button ---------- */
.run-btn {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 13px 20px;
  border: none;
  border-radius: 999px;
  background: var(--star-gold);
  color: var(--void);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: filter .15s ease, opacity .15s ease;
}
.run-btn:hover:not(:disabled) { filter: brightness(1.08); }
.run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.run-status {
  text-align: center;
  font-size: 12px;
  color: var(--ink-dim);
  min-height: 16px;
  margin: 8px 0 0;
}

/* ---------- Result cards ---------- */
.result-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.result-card {
  background: var(--nebula);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.result-card__text {
  margin: 0 0 10px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
}
.result-card__balls { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Status bar & toast ---------- */
.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  text-align: center;
  font-size: 12px;
  color: var(--ink-dim);
  padding: 10px;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 56px;
  transform: translate(-50%, 12px);
  background: var(--nebula-2);
  border: 1px solid var(--star-gold-soft);
  color: var(--ink);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  max-width: 90vw;
  text-align: center;
  z-index: 20;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Focus ---------- */
button:focus-visible, input:focus-visible, label:focus-visible {
  outline: 2px solid var(--star-gold);
  outline-offset: 2px;
}

/* ---------- Responsive ---------- */
@media (min-width: 640px) {
  .hero__title { font-size: 36px; }
  .stat-row { grid-template-columns: repeat(4, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>

// 「整體版路圖」(mode 99,彙整多種模式的整體視圖)排在第三/四階段,先不放進來。

<script>
/**
 * 星辰路引 - 日期工具
 * 對應原始程式的 _parse_lotto_date_cached / _next_draw_date_cached。
 * 統一以 UTC 計算,只在意「哪一天」,避免時區造成日期偏移一天的問題。
 */

function parseLottoDate(dateStr) {
  const s = (dateStr || '').trim();
  if (!s) throw new Error('空白日期');

  const sep = s.includes('/') ? '/' : '-';
  const parts = s.split(sep).map(p => p.trim());
  if (parts.length !== 3) throw new Error('日期格式錯誤: ' + s);

  const [y, m, d] = parts.map(p => parseInt(p, 10));
  if (![y, m, d].every(Number.isFinite)) throw new Error('日期格式錯誤: ' + s);

  const dt = new Date(Date.UTC(y, m - 1, d));
  const valid = dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  if (!valid) throw new Error('無效日期: ' + s);
  return dt;
}

function addDays(date, days) {
  const dt = new Date(date.getTime());
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt;
}

function dateKey(date) {
  return date.toISOString().slice(0, 10);
}

function formatDate(date) {
  const y = date.getUTCFullYear();
  const m = String(date.getUTCMonth() + 1).padStart(2, '0');
  const d = String(date.getUTCDate()).padStart(2, '0');
  return `${y}/${m}/${d}`;
}

const WEEKDAY_LABELS_JS = ['日', '一', '二', '三', '四', '五', '六'];

function formatDateWithWeekday(date) {
  return `${formatDate(date)}(${WEEKDAY_LABELS_JS[date.getUTCDay()]})`;
}

// 對應 _next_draw_date_cached:回傳指定日期之後的下一個開獎日
function nextDrawDate(lottoType, fromDate) {
  const cfg = getLottoConfig(lottoType);
  const allowed = new Set(cfg.drawDaysJS);
  let dt = new Date(fromDate.getTime());
  do {
    dt = addDays(dt, 1);
  } while (!allowed.has(dt.getUTCDay()));
  return dt;
}

</script>
<script>
/**
 * 星辰路引 - CSV 開獎資料解析
 * 對應原始程式 load_lotto_data() 的解析與驗證規則(下載/本機快取的部分
 * 改成使用者手動上傳檔案,其餘規則盡量保持一致):
 *  - 略過表頭第一列
 *  - 「天天樂」(lottoType 1)沿用原本「日期 +1 天」的校正
 *  - 每列需有:日期, 期別, N 個號碼[, 特別號],號碼需在合法範圍內
 *  - 同一天重複資料只保留一筆,最後依日期由舊到新排序
 */

function splitCsvLine(line) {
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else {
        cur += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      out.push(cur);
      cur = '';
    } else {
      cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function isDigitsOnly(s) {
  return /^[0-9]+$/.test(s);
}

/**
 * @param {string} text 原始 CSV 文字內容
 * @param {number} lottoType 彩種 id(0~3)
 * @returns {{data: Array, skipped: number, total: number}}
 */
function parseLottoCsv(text, lottoType) {
  const cfg = getLottoConfig(lottoType);
  const { numCount: n, maxNum, hasSpecial } = cfg;

  const lines = text.split(/\r\n|\r|\n/).filter(l => l.trim().length > 0);
  const rows = lines.slice(1); // 略過表頭

  const seen = new Set();
  const data = [];
  let skipped = 0;

  for (const line of rows) {
    const row = splitCsvLine(line);
    if (row.length < n + 2) { skipped++; continue; }

    try {
      let date = parseLottoDate(row[0]);
      if (lottoType === 1) date = addDays(date, 1);

      const key = dateKey(date);
      if (seen.has(key)) { skipped++; continue; }

      const nums = [];
      for (let i = 2; i < 2 + n; i++) {
        const x = (row[i] || '').trim();
        if (isDigitsOnly(x)) nums.push(parseInt(x, 10));
      }
      if (nums.length !== n || !nums.every(v => v >= 1 && v <= maxNum)) {
        skipped++; continue;
      }
      nums.sort((a, b) => a - b);

      let special = null;
      if (hasSpecial && row.length > n + 2) {
        const sp = (row[n + 2] || '').trim();
        if (isDigitsOnly(sp)) {
          const val = parseInt(sp, 10);
          if (val >= 1 && val <= maxNum) special = val;
        }
      }

      data.push({ date, dateKey: key, numbers: nums, special });
      seen.add(key);
    } catch (e) {
      skipped++;
    }
  }

  data.sort((a, b) => a.date - b.date);
  return { data, skipped, total: data.length };
}

</script>
<script>
/**
 * 星辰路引 - Pyodide 橋接層
 *
 * 為什麼用 Pyodide,而不是把分析邏輯重新用 JS 手刻一遍:
 * 原始 execute_analysis_for_date 單一函式就近 5900 行,15 種模式的巢狀迴圈
 * 彼此共用、糾纏在一起,手動翻譯成另一種語言很容易在某個模式悄悄算錯而不
 * 自知。Pyodide 讓瀏覽器直接執行「幾乎原封不動」的原始 Python 邏輯(只拿掉
 * ui / photos / console 等 iOS 專屬套件),正確性風險低很多。
 *
 * 引擎原始碼是用 base64 直接內嵌在 index.html 裡(見 #lotto-engine-b64),
 * 不透過 fetch() 讀取另一個檔案 —— 這樣單一 index.html 檔案就能完整運作,
 * 不會因為預覽環境或使用者直接雙擊開檔而讀不到旁邊的檔案。
 *
 * 代價:第一次使用時需要下載 Pyodide 執行環境(數MB),之後瀏覽器會快取。
 */

const PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/';

let pyodideReadyPromise = null;

function loadPyodideScriptOnce() {
  if (window.loadPyodide) return Promise.resolve();
  if (loadPyodideScriptOnce._p) return loadPyodideScriptOnce._p;
  loadPyodideScriptOnce._p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PYODIDE_CDN + 'pyodide.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Pyodide 主程式載入失敗,請確認網路連線後重試'));
    document.head.appendChild(s);
  });
  return loadPyodideScriptOnce._p;
}

function decodeEmbeddedEngineSource() {
  const tag = document.getElementById('lotto-engine-b64');
  if (!tag) throw new Error('找不到內嵌的引擎原始碼(#lotto-engine-b64)');
  const b64 = tag.textContent.trim();
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

async function getPyodideReady(onStatus) {
  if (!pyodideReadyPromise) {
    pyodideReadyPromise = (async () => {
      onStatus && onStatus('載入 Python 執行環境(第一次會慢一點)…');
      await loadPyodideScriptOnce();
      const pyodide = await loadPyodide({ indexURL: PYODIDE_CDN });

      onStatus && onStatus('載入版路分析引擎…');
      const code = decodeEmbeddedEngineSource();
      await pyodide.runPythonAsync(code);
      return pyodide;
    })().catch(err => {
      pyodideReadyPromise = null; // 失敗時重置,讓使用者可以重試
      throw err;
    });
  }
  return pyodideReadyPromise;
}

/**
 * @param {object} payload
 *   lottoType, modeId, rows:[[dateISO,[nums],special|null]...],
 *   predRangeIndex, dataLimitIndex, limitDateISO, excludeToday, modeSettings
 * @param {(msg:string)=>void} [onStatus] 進度訊息callback
 * @returns {Promise<object>} { ok, results:[{text,predNums,streak}], nextResults, totalTop, totalNext } 或 { ok:false, error }
 */
async function runAnalysis(payload, onStatus) {
  const pyodide = await getPyodideReady(onStatus);
  onStatus && onStatus('計算中…');
  pyodide.globals.set('_payload_json', JSON.stringify(payload));
  const outJson = await pyodide.runPythonAsync('run_analysis_json(_payload_json)');
  return JSON.parse(outJson);
}

</script>
<script>
/**
 * 星辰路引 - 網頁版主程式(第一階段:骨架 + 資料匯入)
 */

const state = {
  lottoType: 0,
  activeTab: 'data',
  selectedMode: null,
  byType: {
    0: null, 1: null, 2: null, 3: null, // 每個彩種各自存 { data, skipped, fileName, uploadedAt }
  },
  resultsByType: { 0: null, 1: null, 2: null, 3: null }, // 每個彩種各自存上次的分析結果
  isAnalyzing: false,
};

const el = (sel, root = document) => root.querySelector(sel);
const els = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function showToast(msg) {
  const toast = el('#toast');
  toast.textContent = msg;
  toast.classList.add('is-visible');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('is-visible'), 2600);
}

function ballHtml(num, kind = 'normal') {
  return `<span class="ball ball--${kind}">${String(num).padStart(2, '0')}</span>`;
}

function currentEntry() {
  return state.byType[state.lottoType];
}

function updateStatusBar() {
  const cfg = getLottoConfig(state.lottoType);
  const entry = currentEntry();
  const bar = el('#statusBar');
  bar.textContent = entry
    ? `${cfg.name} · 已載入 ${entry.data.length} 筆資料`
    : `${cfg.name} · 尚未匯入資料`;
}

// ---------- 彩種切換 ----------
function setLottoType(id) {
  state.lottoType = id;
  els('.lotto-picker__btn').forEach(btn => {
    btn.classList.toggle('is-active', Number(btn.dataset.lotto) === id);
  });
  renderDataTab();
  renderSettingsTab();
  renderResultsTab();
  updateStatusBar();
}

// ---------- 分頁切換 ----------
function setTab(tab) {
  state.activeTab = tab;
  els('.tabs__btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.tab === tab);
  });
  els('.tab-content').forEach(section => {
    section.hidden = section.dataset.tabContent !== tab;
  });
}

// ---------- 資料分頁 ----------
function renderDataTab() {
  const cfg = getLottoConfig(state.lottoType);
  const entry = currentEntry();
  const container = el('#tab-data');

  if (!entry) {
    const numLabels = Array.from({ length: cfg.numCount }, (_, i) => `號碼${i + 1}`).join(', ');
    container.innerHTML = `
      <div class="upload-card">
        <p class="upload-card__title">尚未載入「${cfg.name}」的開獎資料</p>
        <p class="upload-card__hint">
          CSV 欄位順序:開獎日期, 期別, ${numLabels}${cfg.hasSpecial ? ', 特別號' : ''}。
          第一列表頭會自動略過;若檔案沒有表頭,請自行加一行再上傳。
        </p>
        <label class="upload-btn" for="fileInput">選擇 CSV 檔案</label>
        <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
      </div>
    `;
    wireFileInput();
    return;
  }

  const rows = entry.data.slice().reverse(); // 畫面上新到舊
  const earliest = entry.data[0];
  const latest = entry.data[entry.data.length - 1];
  const next = nextDrawDate(state.lottoType, latest.date);

  container.innerHTML = `
    <div class="stat-row">
      <div class="stat"><span class="stat__value">${entry.data.length}</span><span class="stat__label">筆資料</span></div>
      <div class="stat"><span class="stat__value">${formatDate(earliest.date)}</span><span class="stat__label">最早一筆</span></div>
      <div class="stat"><span class="stat__value">${formatDate(latest.date)}</span><span class="stat__label">最新一筆</span></div>
      <div class="stat"><span class="stat__value">${formatDateWithWeekday(next)}</span><span class="stat__label">下一次開獎</span></div>
    </div>
    ${entry.skipped > 0 ? `<p class="upload-card__hint">已略過 ${entry.skipped} 筆格式不符的資料列。</p>` : ''}
    <div class="draw-table">
      ${rows.map(r => `
        <div class="draw-row">
          <span class="draw-row__date">${formatDateWithWeekday(r.date)}</span>
          <span class="draw-row__balls">
            ${r.numbers.map(n => ballHtml(n)).join('')}
            ${r.special != null ? ballHtml(r.special, 'special') : ''}
          </span>
        </div>
      `).join('')}
    </div>
    <label class="upload-btn upload-btn--ghost" for="fileInput">重新上傳 CSV</label>
    <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
  `;
  wireFileInput();
}

function wireFileInput() {
  const input = el('#fileInput');
  if (!input) return;
  input.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) handleFile(file);
  });

  const card = el('.upload-card');
  if (!card) return;
  ['dragover', 'dragenter'].forEach(evt =>
    card.addEventListener(evt, (e) => { e.preventDefault(); card.classList.add('is-dragging'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    card.addEventListener(evt, (e) => { e.preventDefault(); card.classList.remove('is-dragging'); })
  );
  card.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { data, skipped, total } = parseLottoCsv(String(reader.result), state.lottoType);
      if (total === 0) {
        showToast('沒有解析到有效資料列,請確認 CSV 欄位順序');
        return;
      }
      state.byType[state.lottoType] = { data, skipped, fileName: file.name, uploadedAt: new Date() };
      state.resultsByType[state.lottoType] = null; // 資料變了,舊的分析結果不再有意義
      renderDataTab();
      renderSettingsTab();
      renderResultsTab();
      updateStatusBar();
      showToast(`已匯入 ${total} 筆資料`);
    } catch (err) {
      showToast('讀取失敗:' + err.message);
    }
  };
  reader.onerror = () => showToast('讀取檔案失敗');
  reader.readAsText(file, 'utf-8');
}

// ---------- 參數設定分頁 ----------
function renderSettingsTab() {
  const container = el('#tab-settings');
  const entry = currentEntry();

  container.innerHTML = `
    ${!entry ? `<p class="empty-note">尚未匯入開獎資料,你仍可以先選版路模式,匯入資料後就能開始比對。</p>` : ''}
    <p class="section-label">選擇分析版路</p>
    <div class="mode-grid">
      ${MODE_CONFIGS.map(m => `<button class="mode-btn" data-mode="${m.id}">${m.name}</button>`).join('')}
    </div>

    <p class="section-label">預測範圍(期數)</p>
    <div class="segmented" data-group="predRange">
      ${PRED_RANGE_OPTIONS.map((label, i) => `<button class="segmented__btn${i === 0 ? ' is-active' : ''}">${label}</button>`).join('')}
    </div>

    <p class="section-label">分析資料量</p>
    <div class="segmented" data-group="dataLimit">
      ${DATA_LIMIT_OPTIONS.map((label, i) => `<button class="segmented__btn${i === 2 ? ' is-active' : ''}">${label}</button>`).join('')}
    </div>

    <p class="section-label">截止日期(留空 = 用最新一筆資料當基準)</p>
    <input type="date" class="date-input" id="deadlineInput">

    <button class="run-btn" id="runAnalysisBtn" ${entry ? '' : 'disabled'}>
      ${state.selectedMode == null ? '先選一個版路模式' : '執行分析'}
    </button>
    <p class="run-status" id="runStatus"></p>
  `;

  els('.mode-btn', container).forEach(btn => {
    btn.classList.toggle('is-active', Number(btn.dataset.mode) === state.selectedMode);
    btn.addEventListener('click', () => {
      els('.mode-btn', container).forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const mode = MODE_CONFIGS.find(m => String(m.id) === btn.dataset.mode);
      state.selectedMode = mode.id;
      const runBtn = el('#runAnalysisBtn', container);
      if (runBtn) runBtn.textContent = '執行分析';
    });
  });

  els('.segmented', container).forEach(group => {
    els('.segmented__btn', group).forEach(btn => {
      btn.addEventListener('click', () => {
        els('.segmented__btn', group).forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    });
  });

  const runBtn = el('#runAnalysisBtn', container);
  if (runBtn) runBtn.addEventListener('click', runAnalysisFlow);
}

function getSegmentedIndex(groupName) {
  const group = el(`.segmented[data-group="${groupName}"]`);
  if (!group) return 0;
  const btns = els('.segmented__btn', group);
  const activeIdx = btns.findIndex(b => b.classList.contains('is-active'));
  return activeIdx >= 0 ? activeIdx : 0;
}

// ---------- 執行分析(呼叫 Pyodide 引擎) ----------
async function runAnalysisFlow() {
  const entry = currentEntry();
  if (!entry) { showToast('請先在「資料」分頁匯入開獎資料'); return; }
  if (state.selectedMode == null) { showToast('請先選一個版路模式'); return; }
  if (state.isAnalyzing) return;

  const deadlineInput = el('#deadlineInput');
  const latest = entry.data[entry.data.length - 1];
  const limitDateISO = (deadlineInput && deadlineInput.value) ? deadlineInput.value : latest.dateKey;

  const payload = {
    lottoType: state.lottoType,
    modeId: state.selectedMode,
    rows: entry.data.map(r => [r.dateKey, r.numbers, r.special]),
    predRangeIndex: getSegmentedIndex('predRange'),
    dataLimitIndex: getSegmentedIndex('dataLimit'),
    limitDateISO,
    excludeToday: false,
  };

  state.isAnalyzing = true;
  const runBtn = el('#runAnalysisBtn');
  const runStatus = el('#runStatus');
  if (runBtn) { runBtn.disabled = true; runBtn.textContent = '運算中…'; }

  try {
    const result = await runAnalysis(payload, (msg) => {
      if (runStatus) runStatus.textContent = msg;
    });
    if (!result.ok) {
      showToast('分析失敗:' + result.error);
      if (runStatus) runStatus.textContent = '上次執行失敗,可以再試一次。';
      return;
    }
    state.resultsByType[state.lottoType] = {
      modeId: state.selectedMode,
      modeName: (MODE_CONFIGS.find(m => m.id === state.selectedMode) || {}).name || '',
      ...result,
      ranAt: new Date(),
    };
    renderResultsTab();
    setTab('results');
    showToast(`分析完成,找到 ${result.totalTop} 條版路`);
  } catch (err) {
    showToast('發生錯誤:' + err.message);
    if (runStatus) runStatus.textContent = '發生錯誤:' + err.message;
  } finally {
    state.isAnalyzing = false;
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = '執行分析'; }
  }
}

// ---------- 分析結果分頁 ----------
function renderResultsTab() {
  const container = el('#tab-results');
  const cfg = getLottoConfig(state.lottoType);
  const analysis = state.resultsByType[state.lottoType];

  if (!analysis) {
    container.innerHTML = `
      <p class="empty-note">
        分析結果會顯示在這裡。在「參數設定」選好版路模式、按下「執行分析」後,
        這裡會列出目前找得到的版路與最新預測號碼。
      </p>
    `;
    return;
  }

  const renderList = (list, title) => {
    if (!list || list.length === 0) return '';
    return `
      <p class="section-label">${title}(共 ${list.length} 條,顯示前 ${Math.min(list.length, 30)} 條)</p>
      <div class="result-list">
        ${list.map(r => `
          <div class="result-card">
            <pre class="result-card__text">${escapeHtml(r.text.trim())}</pre>
            ${r.predNums && r.predNums.length ? `
              <div class="result-card__balls">
                ${r.predNums.map(n => ballHtml(n)).join('')}
              </div>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  };

  container.innerHTML = `
    <p class="section-label">${cfg.name} · ${analysis.modeName}</p>
    ${renderList(analysis.results, '目前版路(以最新截止日為準)')}
    ${renderList(analysis.nextResults, '下一期預告')}
    ${(!analysis.results || analysis.results.length === 0) ? '<p class="empty-note">這個模式在目前的設定與資料下沒有找到符合條件的版路,可以試試看調整資料量或截止日期。</p>' : ''}
  `;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ---------- 初始化 ----------
function init() {
  els('.lotto-picker__btn').forEach(btn => {
    btn.addEventListener('click', () => setLottoType(Number(btn.dataset.lotto)));
  });
  els('.tabs__btn').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  renderDataTab();
  renderSettingsTab();
  renderResultsTab();
  updateStatusBar();
}

document.addEventListener('DOMContentLoaded', init);

</script>

</body>
</html>
