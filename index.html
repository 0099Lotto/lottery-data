<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂透開獎號碼查詢</title>
  <!-- 引入輕量 CSV 解析工具 PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #f8f9fa; color: #333; }
    h2 { margin-bottom: 15px; }
    select { width: 100%; max-width: 300px; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; }
    .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
    th { background-color: #007aff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
  </style>
</head>
<body>

  <h2>樂透開獎號碼查詢</h2>
  
  <select id="fileSelect" onchange="loadCSV(this.value)">
    <option value="tw539.csv">台灣今彩 539 (tw539.csv)</option>
    <option value="hkmark6.csv">香港六合彩 (hkmark6.csv)</option>
    <option value="us539.csv">美國 539 (us539.csv)</option>
    <option value="rk8e49.csv">其他彩券 (rk8e49.csv)</option>
  </select>

  <div class="table-container">
    <div id="status" style="padding: 20px; text-align: center;">資料載入中...</div>
    <table id="dataTable" style="display: none;">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    function loadCSV(fileName) {
      const status = document.getElementById('status');
      const table = document.getElementById('dataTable');
      status.style.display = 'block';
      status.innerText = '資料載入中...';
      table.style.display = 'none';

      // 使用相對路徑直接抓取同儲存庫內的 CSV
      Papa.parse(fileName, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            renderTable(results.data);
            status.style.display = 'none';
            table.style.display = 'table';
          } else {
            status.innerText = '檔案內容為空或讀取失敗。';
          }
        },
        error: function(err) {
          status.innerText = '讀取檔案失敗，請確定檔案名稱正確。';
          console.error(err);
        }
      });
    }

    function renderTable(data) {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = '';
      body.innerHTML = '';

      // 取得欄位標頭
      const headers = Object.keys(data[0]);
      let headRow = '<tr>';
      headers.forEach(h => headRow += `<th>${h}</th>`);
      headRow += '</tr>';
      head.innerHTML = headRow;

      // 填充資料內容
      data.forEach(row => {
        let bodyRow = '<tr>';
        headers.forEach(h => bodyRow += `<td>${row[h] || ''}</td>`);
        bodyRow += '</tr>';
        body.innerHTML += bodyRow;
      });
    }

    // 預設載入第一個選單
    window.onload = () => {
      loadCSV(document.getElementById('fileSelect').value);
    };
  </script>

</body>
</html>
