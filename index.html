<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂透開獎號碼查詢</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background-color: #f8f9fa; color: #333; margin: 0; }
    h2 { margin-top: 10px; margin-bottom: 5px; text-align: center; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 15px; text-align: center; }
    select { width: 100%; max-width: 400px; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; margin: 0 auto 20px auto; display: block; background: white; }
    .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; min-height: 150px; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; white-space: nowrap; font-size: 14px; }
    th { background-color: #007aff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    #status { padding: 30px; text-align: center; color: #666; font-size: 15px; }
  </style>
</head>
<body>

  <h2>樂透開獎號碼查詢</h2>
  <p class="subtitle">顯示最新 5 期開獎紀錄</p>
  
  <select id="fileSelect" onchange="loadCSV(this.value)">
    <option value="tw539.csv">台灣今彩 539 (tw539.csv)</option>
    <option value="hkmark6.csv">香港六合彩 (hkmark6.csv)</option>
    <option value="us539.csv">美國 539 (us539.csv)</option>
    <option value="rk8e49.csv">其他彩券 (rk8e49.csv)</option>
  </select>

  <div class="table-container">
    <div id="status">資料載入中...</div>
    <table id="dataTable" style="display: none;">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    async function loadCSV(fileName) {
      const status = document.getElementById('status');
      const table = document.getElementById('dataTable');
      status.style.display = 'block';
      status.innerText = '⚡ 快速讀取中...';
      table.style.display = 'none';

      const url = `./${fileName}?v=${new Date().getTime()}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('無法取得檔案');
        const csvText = await response.text();

        // 解析無標題的 CSV
        const parsed = Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true
        });

        if (parsed.data && parsed.data.length > 0) {
          // 只取最後 5 筆（最新開獎），並反轉讓最新的排在第一筆
          const latest5 = parsed.data.slice(-5).reverse();
          renderTable(latest5);
          status.style.display = 'none';
          table.style.display = 'table';
        } else {
          status.innerText = '⚠️ 檔案內沒有資料';
        }
      } catch (err) {
        status.innerText = '❌ 載入失敗，請確認 CSV 檔案正常';
        console.error(err);
      }
    }

    function renderTable(dataRows) {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = '';
      body.innerHTML = '';

      // 自動產生表頭：開獎日期, 期號, 號碼 1, 號碼 2...
      const colCount = dataRows[0].length;
      let headRow = '<tr><th>開獎日期</th><th>期號</th>';
      for (let i = 2; i < colCount; i++) {
        headRow += `<th>號碼 ${i - 1}</th>`;
      }
      headRow += '</tr>';
      head.innerHTML = headRow;

      // 渲染最新 5 筆資料
      dataRows.forEach(row => {
        let bodyRow = '<tr>';
        row.forEach(val => bodyRow += `<td>${val || ''}</td>`);
        bodyRow += '</tr>';
        body.innerHTML += bodyRow;
      });
    }

    window.onload = () => {
      loadCSV(document.getElementById('fileSelect').value);
    };
  </script>

</body>
</html>
