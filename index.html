<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星辰路引｜週牌版路圖</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#243447;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif}.app{max-width:1200px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#173b5e,#2d5f86);color:#fff;border-radius:0 0 16px 16px;padding:17px 14px;box-shadow:0 4px 16px #0002}.top h1{margin:0;text-align:center;font-size:22px}.top .sub{text-align:center;font-size:12px;opacity:.85;margin-top:5px}.card{background:#fff;border:1px solid #d8e0e9;border-radius:15px;padding:13px;margin:10px 0;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}label{display:block;font-size:12px;color:#5d6c7d;margin-bottom:4px}select,input{width:100%;border:1px solid #cdd8e4;border-radius:8px;background:#fff;padding:9px;font-size:14px}select[multiple]{min-height:105px}.checks{display:flex;flex-wrap:wrap;gap:5px}.checks label{margin:0;border:1px solid #d9e2ec;background:#f8fafc;padding:7px 8px;border-radius:8px;color:#33485e}.checks input{width:auto;margin:0 3px 0 0}.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}button{border:0;border-radius:9px;padding:10px 7px;color:#fff;font-weight:700;background:#1f4e79;cursor:pointer}button:disabled{opacity:.45}button.green{background:#248a54}button.red{background:#c63d49}button.orange{background:#c77a00}button.purple{background:#6d43a6}button.gray{background:#68778a}.status,.output{white-space:pre-wrap}.status{font-size:13px;line-height:1.55;background:#f6f9fc;border-radius:9px;padding:10px}.output{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#fafcff;border:1px solid #e1e8ef;border-radius:10px;padding:11px;max-height:560px;overflow:auto}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:center;padding:7px 5px;border-bottom:1px solid #edf1f5;white-space:nowrap}th{background:#1f4e79;color:#fff}.hidden{display:none}.progress{height:7px;background:#dce5ee;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#1f4e79}.metricGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-bottom:9px}.metric{border:1px solid #dce5ee;border-radius:10px;padding:9px;background:#fbfcfe}.metric b{display:block;font-size:11px;color:#708095;margin-bottom:3px}.chart{display:grid;grid-template-columns:95px repeat(10,46px);min-width:555px;border-top:1px solid #cfd8e3;border-left:1px solid #cfd8e3}.chart div{min-height:30px;border-right:1px solid #cfd8e3;border-bottom:1px solid #cfd8e3;text-align:center;padding:5px 2px;font-size:10px}.chart .h{background:#edf2f7;font-weight:700}.chart .hit{background:#1f4e79;color:#fff;font-weight:700}.hint{font-size:11px;color:#78879a;margin-top:7px}@media(max-width:600px){.app{padding:7px}.grid{grid-template-columns:1fr 1fr}.btns{grid-template-columns:repeat(2,1fr)}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>🌌 星辰路引｜週牌版路圖</h1><div class="sub">GitHub Pages 完整分析版｜分析核心依照原 Python 程式邏輯移植</div></header>
<section class="card">
 <div class="grid">
  <div><label>樂透類型</label><select id="lottery"><option value="0">今彩539</option><option value="1">天天樂</option><option value="2">大樂透</option><option value="3">六合彩</option></select></div>
  <div><label>截止日期</label><input id="cutoff" type="date"></div>
  <div><label>模式</label><select id="mode"><option value="0">立柱模式</option><option value="1">號碼模式</option></select></div>
  <div><label>立柱配置（例如 2,2,1）</label><input id="columns" value="2,2,1"></div>
  <div><label>號碼數（號碼模式）</label><input id="numNumbers" type="number" min="1" max="10" value="5"></div>
  <div><label>最低中星數</label><select id="minStars" multiple><option value="1">1星</option><option value="2" selected>2星</option><option value="3">3星</option><option value="4">4星</option><option value="5">5星</option><option value="6">6星</option></select></div>
  <div><label>空幾期</label><input id="skipPeriods" type="number" min="0" max="20" value="0"></div>
  <div><label>斷幾期</label><input id="breakPeriods" type="number" min="0" max="20" value="1"></div>
  <div><label>回測每輪秒數</label><input id="backtestSeconds" type="number" min="1" max="30" value="3"></div>
 </div>
 <div style="margin-top:9px"><label>星期</label><div id="weekdays" class="checks"></div></div>
 <div style="margin-top:9px"><label>分析選項</label><div class="checks">
  <label><input id="includeSpecial" type="checkbox">包含特別號</label><label><input id="allPass" type="checkbox" checked>全過關</label><label><input id="latestMiss" type="checkbox">最新一期未達標</label><label><input id="threePeriod" type="checkbox">3期中一次</label><label><input id="breakMode" type="checkbox">斷幾期模式</label><label><input id="excludeToday" type="checkbox">排除當天</label><label><input id="consecutive" type="checkbox">連號模式</label><label><input id="lastDigit" type="checkbox">尾數模式</label>
 </div></div>
 <div class="btns"><button id="update" class="green">⚡ 讀取／更新</button><button id="analyze">▶ 開始分析</button><button id="miss" class="red">🔴 不出分析</button><button id="backtest" class="orange">🧪 30期回測</button><button id="recent" class="gray">近10期</button><button id="chartBtn" class="purple">版路圖</button><button id="stop" class="red" disabled>■ 中止</button></div>
</section>
<section class="card"><b>資料狀態</b><div id="status" class="status" style="margin-top:7px">載入中…</div></section>
<section class="card"><div style="display:flex;justify-content:space-between"><b>分析結果</b><span id="running" style="font-size:12px"></span></div><div class="progress"><i id="progressBar"></i></div><div id="metrics" class="metricGrid"></div><pre id="output" class="output">等待分析…</pre></section>
<section class="card hidden" id="recentCard"><b>近10期開獎</b><div class="scroll" style="margin-top:7px"><table><thead id="recentHead"></thead><tbody id="recentBody"></tbody></table></div></section>
<section class="card hidden" id="chartCard"><b>版路分析圖</b><div class="scroll" style="margin-top:7px"><div id="chart" class="chart"></div></div><div class="hint">版路圖使用目前分析得到的第一名組合，顯示最近最多60個符合星期的開獎日。</div></section>
</div>
<script>
const POPULATION_SIZE=200,NO_IMPROVEMENT_LIMIT=200,MAX_GENERATIONS_TO_RUN=200,TOURNAMENT_SIZE=7,MAX_WEEKS=40,MAX_WEEKS_THREE=100,STREAK_THRESHOLD=35;
const CFG=[{name:'今彩539',max:39,balls:5,file:'tw539.csv'},{name:'天天樂',max:39,balls:5,file:'us539.csv'},{name:'大樂透',max:49,balls:6,file:'rk8e49.csv'},{name:'六合彩',max:49,balls:6,file:'hkmark6.csv'}];
const weekdayNames=['週一','週二','週三','週四','週五','週六','週日'];let draws=new Map(),state={type:0,cut:null,combo:null,detail:[],score:null,config:null,stopped:false};let running=false,token=0;
const $=id=>document.getElementById(id), statusEl=$('status'),out=$('output'),metrics=$('metrics'),bar=$('progressBar'),runEl=$('running');
function dateFrom(s){let m=String(s||'').trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function iso(d){return fmt(d)} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function key(d){return fmt(d)} function day(d){return (d.getDay()+6)%7}
function selectedDays(){return [...document.querySelectorAll('#weekdays input:checked')].map(x=>+x.value)}
function stars(){return [...$('minStars').selectedOptions].map(x=>+x.value).sort((a,b)=>a-b)}
function options(){return {type:+$('lottery').value,cut:new Date($('cutoff').value+'T23:59:59'),mode:+$('mode').value,cols:$('columns').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>Number.isFinite(x)&&x>0),count:+$('numNumbers').value||5,stars:stars(),days:selectedDays(),includeSpecial:$('includeSpecial').checked,allPass:$('allPass').checked,latestMiss:$('latestMiss').checked,three:$('threePeriod').checked,skip:+$('skipPeriods').value||0,breakMode:$('breakMode').checked,breakPeriods:+$('breakPeriods').value||0,excludeToday:$('excludeToday').checked,consecutive:$('consecutive').checked,lastDigit:$('lastDigit').checked}}
function drawNums(obj,o){let a=(obj?.numbers||[]).slice();if(o.includeSpecial&&obj?.special!=null)a.push(obj.special);return a}
function parseText(text,type,cut){let cfg=CFG[type],rows=Papa.parse(text,{header:false,skipEmptyLines:true}).data,arr=[];for(const raw of rows){if(!raw?.length)continue;let r=raw.map(v=>String(v??'').trim());if(r.length<(type<2?7:8))continue;let d=dateFrom(r[0]);if(!d)continue;if(type===1)d=addDays(d,1);if(cut&&d>cut)continue;let ns=r.slice(2,2+cfg.balls).map(Number);if(ns.some(n=>!Number.isInteger(n)||n<1||n>cfg.max))continue;let si=2+cfg.balls,special=(r[si]&&/^\d+$/.test(r[si]))?+r[si]:null;arr.push({date:d,period:r[1]||'',numbers:ns,special});}arr.sort((a,b)=>a.date-b.date);let m=new Map();for(const x of arr)m.set(key(x.date),x);return m}
async function loadData(){let o=options();state.type=o.type;statusEl.textContent=`⚡ 正在讀取 ${CFG[o.type].file} …`;try{let r=await fetch('./'+CFG[o.type].file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draws=parseText(await r.text(),o.type,o.cut);if(!draws.size)throw Error('CSV沒有可辨識資料');let dates=[...draws.values()].map(x=>x.date).sort((a,b)=>a-b),last=dates.at(-1);if(!$('cutoff').value||new Date($('cutoff').value)>last)$('cutoff').value=iso(last);statusEl.textContent=`✅ ${CFG[o.type].name} 資料載入完成\n共 ${draws.size} 期｜最新：${fmt(last)}\n檔案：${CFG[o.type].file}\n⚠️ 分析會讀取整個 CSV 的分析範圍，不是只讀近10期。`;showRecent()}catch(e){draws=new Map();statusEl.textContent='❌ '+e.message+'\n請確認 index.html 與 CSV 位於 GitHub 同一層。';}}
function validDates(cut,days){return [...draws.values()].map(x=>x.date).filter(d=>d<=cut&&days.includes(day(d))).sort((a,b)=>b-a)}
function buildNumberPool(o){let dates;if(o.three)dates=validDates(o.cut,o.days).slice(0,MAX_WEEKS_THREE*4);else dates=[...draws.values()].map(x=>x.date).filter(d=>d<=o.cut&&d>=addDays(o.cut,-MAX_WEEKS*7)&&o.days.includes(day(d))).sort((a,b)=>b-a);let c=Array(CFG[o.type].max+1).fill(0),total=0;for(const d of dates){for(const n of drawNums(draws.get(key(d)),o))c[n]++;total++}return Array.from({length:CFG[o.type].max},(_,i)=>i+1).sort((a,b)=>c[b]-c[a])}
function historicalCombinations(o){let dates=o.three?validDates(o.cut,o.days).slice(0,MAX_WEEKS_THREE*4):[...draws.values()].map(x=>x.date).filter(d=>d<=o.cut&&d>=addDays(o.cut,-MAX_WEEKS*7)&&o.days.includes(day(d))).sort((a,b)=>b-a);let seen=new Set(),a=[];for(const d of dates){let c=drawNums(draws.get(key(d)),o);let k=c.join(',');if(!seen.has(k)){seen.add(k);a.push(c)}}return a}
function groupWeeks(o){if(o.three){let ds=validDates(o.cut,o.days),g=[],i=0;while(i+3<=ds.length){g.push(ds.slice(i,i+3));i+=3+o.skip}return g.slice(0,MAX_WEEKS_THREE)}let m=new Map(),start=addDays(o.cut,-MAX_WEEKS*7);for(const x of draws.values()){if(x.date>o.cut||x.date<start||!o.days.includes(day(x.date)))continue;let mon=addDays(x.date,-day(x.date)),k=key(mon);if(!m.has(k))m.set(k,[]);m.get(k).push(x.date)}return [...m.values()].sort((a,b)=>b[0]-a[0]).slice(0,MAX_WEEKS)}
function hitCalc(combo,draw,o,detail=false){if(!draw)return {hits:0,nums:[],pillars:[]};let rawNums=drawNums(draw,o),nums=[];let hits;if(o.lastDigit){let tails=new Set(combo.map(n=>n%10));nums=[...new Set(rawNums.filter(n=>tails.has(n%10)))].sort((a,b)=>a-b);hits=new Set(rawNums.map(n=>n%10)).size?new Set(rawNums.map(n=>n%10).filter(t=>tails.has(t))).size:0}else{nums=[...new Set(combo.filter(n=>rawNums.includes(n)))].sort((a,b)=>a-b);hits=nums.length}let pillars=[];if(o.mode!==1){let s=0;for(const c of o.cols){if(c>0){let p=combo.slice(s,s+c),ph;if(o.lastDigit)ph=new Set(rawNums.map(n=>n%10)).size?[...new Set(rawNums.map(n=>n%10))].filter(t=>new Set(p.map(n=>n%10)).has(t)).length:0;else ph=p.filter(n=>rawNums.includes(n)).length;pillars.push(ph);s+=c}else pillars.push(0)}let vp=pillars.filter(x=>x>0).length,star=0;for(const st of [...o.stars].reverse())if(vp>=st&&hits>=st){star=st;break}hits=star}else hits=hits>=Math.min(...o.stars)?hits:0;return {hits,nums,pillars}}
function slidingMetrics(combo,o){let groups=groupWeeks(o);if(!groups.length)return {avg:0,max:0};let vals=[],weights=[],i=0;for(const g of groups){let hs=[],weekdayHits={};for(const d of g){let h=(o.excludeToday&&key(d)===key(o.cut))?0:hitCalc(combo,draws.get(key(d)),o).hits;weekdayHits[day(d)]=h;hs.push(h)}let meets=o.allPass?o.days.every(w=>weekdayHits[w]>=Math.min(...o.stars)):hs.some(h=>h>=Math.min(...o.stars));let w=meets?(hs.length?Math.max(...hs):0):0;vals.push(w);weights.push(1-.1*i);i++}let ws=weights.reduce((a,b)=>a+b,0)||1;return {avg:vals.reduce((s,v,i)=>s+v*weights[i],0)/ws,max:Math.max(...vals)} }
function findRecent(combo,o){let groups=groupWeeks(o);if(!groups.length)return {streak:0,total:0,detail:[],avg:0,max:0,std:0};let minS=Math.min(...o.stars),bad=0;for(const g of groups){let wh={};for(const d of g)wh[day(d)]=(o.excludeToday&&key(d)===key(o.cut))?0:hitCalc(combo,draws.get(key(d)),o).hits;let meet=o.allPass?o.days.every(w=>(wh[w]??0)>=minS):o.days.some(w=>(wh[w]??0)>=minS);if(o.missMode)meet=!meet;if((o.missMode?meet:!meet))bad++;else break}let threshold=o.breakMode?(o.latestMiss?o.breakPeriods+1:o.breakPeriods):0;if(bad<threshold)return {streak:0,total:0,detail:[],avg:0,max:0,std:0};let streak=0,total=0,weekly=[],detail=[],interrupt=0;for(let gi=0;gi<groups.length;gi++){let g=groups[gi],dh={},dn={},dp={},dates={},wh=[];for(const d of g){dates[key(d)]=d;let hc=(o.excludeToday&&key(d)===key(o.cut))?{hits:0,nums:[],pillars:[]}:hitCalc(combo,draws.get(key(d)),o);dh[day(d)]=hc.hits;dn[day(d)]=hc.nums;dp[day(d)]=hc.pillars;wh.push(hc.hits);total+=o.missMode?(hc.hits<minS?1:0):hc.hits}let meet=o.allPass?o.days.every(w=>(dh[w]??0)>=minS):o.days.some(w=>(dh[w]??0)>=minS);if(o.missMode)meet=!meet;if(o.latestMiss&&gi===0)meet=false;weekly.push(wh.length?Math.max(...wh):0);if(meet){streak++;interrupt=0}else{interrupt++;if(interrupt>(o.breakMode?o.breakPeriods:0))break}detail.push({start:g[0],hits:dh,nums:dn,pillars:dp,dates})}let av=slidingMetrics(combo,o);let mean=weekly.length?weekly.reduce((a,b)=>a+b,0)/weekly.length:0,std=Math.sqrt(weekly.reduce((s,x)=>s+(x-mean)**2,0)/(weekly.length||1));return {streak,total,detail,avg:av.avg,max:av.max,std}}
function clone(a){return a.slice()}function unique(a){return [...new Set(a)]}function randomCombo(o,pool,count){let c;if(o.consecutive){let s=1+Math.floor(Math.random()*(CFG[o.type].max-count+1));c=Array.from({length:count},(_,i)=>s+i)}else{let p=pool.slice();for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}c=p.slice(0,count)}return c.sort((a,b)=>a-b)}
function initPopulation(o,pool,hist,count){let pop=[];for(const h of hist.slice(0,Math.floor(POPULATION_SIZE*.2)))if(h.length===count&&!pop.some(x=>x.join()==h.join()))pop.push(h.slice(0,count));let tries=0;while(pop.length<POPULATION_SIZE&&tries++<POPULATION_SIZE*50){let c=randomCombo(o,pool,count);if(!pop.some(x=>x.join(',')===c.join(',')))pop.push(c)}return pop}
function tournament(scored){let best=null;for(let i=0;i<TOURNAMENT_SIZE;i++){let x=scored[Math.floor(Math.random()*scored.length)];if(!best||x.fitness>best.fitness)best=x}return best.combo.slice()}
function crossover(a,b,o,count){let c=[],used=new Set();for(let i=0;i<count;i++){let x=Math.random()<.5?a[i]:b[i];if(x!=null&&!used.has(x)){c.push(x);used.add(x);continue}let n=1+Math.floor(Math.random()*CFG[o.type].max);while(used.has(n))n=1+Math.floor(Math.random()*CFG[o.type].max);c.push(n);used.add(n)}return c.sort((x,y)=>x-y)}
function mutate(c,o,pool,rate){if(o.consecutive&&Math.random()<rate){let count=c.length,s=Math.max(1,Math.min(CFG[o.type].max-count+1,c[0]+Math.floor(Math.random()*11)-5));return Array.from({length:count},(_,i)=>s+i)}let x=c.slice();for(let i=0;i<x.length;i++)if(Math.random()<rate){let av=pool.filter(n=>!x.includes(n));if(!av.length)av=Array.from({length:CFG[o.type].max},(_,j)=>j+1).filter(n=>!x.includes(n));x[i]=av[Math.floor(Math.random()*av.length)]}return unique(x).length===x.length?x.sort((a,b)=>a-b):randomCombo(o,pool,x.length)}
function getEliteRate(g){return g<200?.15:g<400?.12:.10}function hotRates(o){let c=Array(CFG[o.type].max+1).fill(0),tot=0;for(const x of draws.values())if(x.date<=o.cut&&o.days.includes(day(x.date))){for(const n of drawNums(x,o))c[n]++;tot+=drawNums(x,o).length}return c.map(v=>tot?v/tot:0)}
async function runAnalysis(o,missMode=false,isBacktest=false){o.missMode=missMode;let pool=buildNumberPool(o),hist=historicalCombinations(o),weeks=groupWeeks(o),count=o.mode===1?o.count:o.cols.reduce((a,b)=>a+b,0)||CFG[o.type].balls,pop=initPopulation(o,pool,hist,count),bestScore={streak:-1,total:-Infinity,std:Infinity},bestCombo=null,bestDetail=[];let noImprove=0;for(let gen=0;gen<MAX_GENERATIONS_TO_RUN&&running;gen++){let scored=[];for(const combo of pop){if(token!==state.token)break;let m=findRecent(combo,o);let hot=hotRates(o),hs=combo.reduce((s,n)=>s+(hot[n]||0),0)/(combo.length||1);let sw=missMode?.60:(m.streak<STREAK_THRESHOLD?.50:.60),tw=missMode?.30:(m.streak<STREAK_THRESHOLD?.40:.30),fit=sw*m.streak+tw*Math.min(m.total,Math.min(...o.stars)*(o.three?MAX_WEEKS_THREE:MAX_WEEKS))+(missMode?-.05:.05)*Math.min(m.avg,Math.min(...o.stars))+(missMode?-.03:.03)*hs-.01*m.std;scored.push({fitness:fit,streak:m.streak,total:m.total,std:m.std,max:m.max,detail:m.detail,combo})}if(!scored.length)break;scored.sort((a,b)=>b.streak-a.streak||b.total-a.total||a.std-b.std);let top=scored[0],changed=(top.streak>bestScore.streak||top.total>bestScore.total||(top.streak===bestScore.streak&&top.total===bestScore.total&&top.std<bestScore.std));if(changed){bestScore={streak:top.streak,total:top.total,std:top.std};bestCombo=top.combo.slice();bestDetail=top.detail;noImprove=0}else noImprove++;bar.style.width=((gen+1)/MAX_GENERATIONS_TO_RUN*100)+'%';runEl.textContent=`第 ${gen+1}/${MAX_GENERATIONS_TO_RUN} 代｜${missMode?'連續不中':'連續過關'}:${bestScore.streak}｜總${missMode?'不中次數':'星數'}:${bestScore.total.toFixed(1)}`;if(!isBacktest)renderRunning(o,bestScore,bestCombo);if(gen%2===0)await new Promise(r=>setTimeout(r,0));let eliteCount=Math.max(1,Math.floor(POPULATION_SIZE*getEliteRate(gen+1))),next=scored.slice(0,eliteCount).map(x=>x.combo.slice()),rate=(noImprove>=50?.20:(gen<200?.15:gen<400?.12:.10));while(next.length<POPULATION_SIZE&&running){next.push(mutate(crossover(tournament(scored),tournament(scored),o,count),o,pool,rate))}pop=next;if(noImprove>=NO_IMPROVEMENT_LIMIT){pop=initPopulation(o,pool,hist,count);noImprove=0}}return {score:bestScore,combo:bestCombo,detail:bestDetail,generation:Math.min(MAX_GENERATIONS_TO_RUN,200)}}
function formatCombo(c,o){if(!c)return '';if(o.lastDigit)return `[${unique(c.map(n=>n%10)).sort((a,b)=>a-b).join(',')}]尾`;if(o.mode===1)return c.slice().sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0')).join(',');let out=[],s=0;for(const n of o.cols){out.push('('+c.slice(s,s+n).sort((a,b)=>a-b).map(x=>String(x).padStart(2,'0')).join(',')+')');s+=n}return out.join('+')}
function renderRunning(o,s,c){out.textContent=`🏎️ 運算中\n樂透類型:${CFG[o.type].name}\n最低中星數:${o.stars.join(',')}\n最佳連續:${s.streak}\n總${o.missMode?'不中次數':'星數'}:${s.total.toFixed(1)}\n標準差:${s.std.toFixed(2)}\n推薦:${formatCombo(c,o)||'計算中…'}`}
function renderResult(o,res){state={...state,cut:o.cut,combo:res.combo,detail:res.detail,score:res.score,config:o,token};let latest=[...draws.values()].sort((a,b)=>b.date-a.date)[0],lines=[];lines.push(`最新開獎日期:${latest?fmt(latest.date):'—'} 號碼:${latest?latest.numbers.map(n=>String(n).padStart(2,'0')).join(','):'—'}${o.includeSpecial&&latest?.special!=null?' (特別號:'+String(latest.special).padStart(2,'0')+')':''}`);if(o.excludeToday&&latest&&key(latest.date)===key(o.cut))lines[0]+=' (排除當天)';lines.push('');lines.push(`樂透類型:${CFG[o.type].name}`);lines.push(`最佳${o.missMode?'連續不中':'連續過關'}:${res.score.streak}`);lines.push(`總${o.missMode?'不中次數':'星數'}:${res.score.total.toFixed(1)}`);lines.push(`標準差:${res.score.std.toFixed(2)}`);lines.push(`運算代數:${res.generation}`);lines.push('');lines.push(`推薦${o.missMode?'不出':''}${o.mode===1?'號碼':'立柱'}(第一名🥇):${formatCombo(res.combo,o)||'無有效組合'}`);if(o.latestMiss&&o.days.length>=2){let past=validDates(o.cut,o.days).filter(d=>d<o.cut).slice(0,o.days.length-1),allMiss=past.length===o.days.length-1&&past.every(d=>hitCalc(res.combo,draws.get(key(d)),o).hits<Math.min(...o.stars));lines.push(`🔍 盤勢:${allMiss?'⚠️【到期機會】':'(非到期盤)'}`)}lines.push('');lines.push('分析詳情:');for(let i=0;i<res.detail.length;i++){let it=res.detail[i];lines.push(o.three?`\n組 ${i+1}:`: `\n${key(it.start)}`);for(const wd of o.days){let ds=Object.keys(it.dates).find(k=>day(it.dates[k])===wd);if(!ds)continue;let d=it.dates[ds],h=it.hits[wd]??0,nums=(it.nums[wd]||[]).join(','),mark=o.missMode?(h<Math.min(...o.stars)?'🌟':'❌'):(h>=Math.min(...o.stars)?'🌟':'❌');lines.push(`  ${weekdayNames[wd]} 星數:${String(h).padStart(2,' ')}${mark} 號碼:${nums} (${fmt(d)})`)}}out.textContent=lines.join('\n');metrics.innerHTML=`<div class="metric"><b>第一名推薦</b>${formatCombo(res.combo,o)||'無'}</div><div class="metric"><b>最佳${o.missMode?'不中':'過關'}</b>${res.score.streak}</div><div class="metric"><b>總值</b>${res.score.total.toFixed(1)}</div><div class="metric"><b>標準差</b>${res.score.std.toFixed(2)}</div>`}
async function analyze(miss=false){if(!draws.size)await loadData();if(!draws.size)return;let o=options();if(!o.stars.length){alert('請至少選擇一個最低中星數');return}if(o.mode===0&&o.cols.reduce((a,b)=>a+b,0)>CFG[o.type].max){alert('立柱總數超過彩券號碼上限');return}running=true;token++;state.token=token;$('analyze').disabled=$('miss').disabled=$('backtest').disabled=true;$('stop').disabled=false;recentCard.classList.add('hidden');chartCard.classList.add('hidden');bar.style.width='0%';try{let res=await runAnalysis(o,miss,false);if(running&&res.combo)renderResult(o,res);else if(!res.combo)out.textContent='無有效組合，請調整星期／星數／立柱設定。'}catch(e){out.textContent='❌ 分析錯誤：'+e.stack}finally{running=false;$('analyze').disabled=$('miss').disabled=$('backtest').disabled=false;$('stop').disabled=true;runEl.textContent=running?'':'分析完成'}}
async function backtest30(){if(!draws.size)await loadData();if(!draws.size)return;let o=options(),days=validDates(o.cut,o.days).slice(0,30);running=true;token++;state.token=token;$('analyze').disabled=$('miss').disabled=$('backtest').disabled=true;$('stop').disabled=false;let results=[];for(let i=0;i<days.length&&running;i++){let target=days[i],bo={...o,cut:target},res=await runAnalysis(bo,false,true),combo=res.combo;if(!combo){results.push({date:target,combo:'—',hits:0});continue}let allAsc=validDates(target,o.days).reverse(),idx=allAsc.findIndex(d=>key(d)===key(target)),check=[];if(o.three){let start=o.latestMiss?Math.max(0,idx-2):idx+1+o.skip*3;check=o.latestMiss?allAsc.slice(start,idx+1):allAsc.slice(start,start+3)}else{check=o.latestMiss?allAsc.slice(Math.max(0,idx-(o.days.length-1)),idx+1):allAsc.slice(idx+1,idx+1+Math.max(1,o.days.length))}let maxHit=0;for(const d of check)maxHit=Math.max(maxHit,hitCalc(combo,draws.get(key(d)),o).hits);let success=o.missMode?! (maxHit>=Math.min(...o.stars)):(maxHit>=Math.min(...o.stars));results.push({date:target,combo:formatCombo(combo,o),hits:maxHit,success});out.textContent=`🧪 回測 ${i+1}/${days.length}\n`+results.map((r,j)=>`第${j+1}輪｜${fmt(r.date)}｜預測 ${r.combo}｜命中 ${r.hits} 碼｜${r.success?'⭕':'❌'}`).join('\n');await new Promise(r=>setTimeout(r,0))}let ok=results.filter(x=>x.success).length;out.textContent+=`\n\n📊 總結:${ok}/${results.length} 輪成功 (勝率 ${results.length?(ok/results.length*100).toFixed(1):'0.0'}%)`;metrics.innerHTML=`<div class="metric"><b>回測期數</b>${results.length}</div><div class="metric"><b>成功</b>${ok}</div><div class="metric"><b>勝率</b>${results.length?(ok/results.length*100).toFixed(1):0}%</div>`;running=false;$('analyze').disabled=$('miss').disabled=$('backtest').disabled=false;$('stop').disabled=true;runEl.textContent='回測完成'}
function showRecent(){let rows=[...draws.values()].sort((a,b)=>b.date-a.date).slice(0,10);$('recentHead').innerHTML='<tr><th>日期</th><th>期號</th><th>開獎號碼</th></tr>';$('recentBody').innerHTML=rows.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.period)}</td><td>${x.numbers.map(n=>String(n).padStart(2,'0')).join('　')}${x.special!=null?'　★'+String(x.special).padStart(2,'0'):''}</td></tr>`).join('');$('recentCard').classList.remove('hidden')}
function showChart(){if(!state.combo){alert('請先完成分析');return}let o=state.config,dates=validDates(o.cut,o.days).slice(0,60).reverse(),nums=state.combo.slice();$('chart').innerHTML='<div class="h">日期</div>'+Array.from({length:10},(_,i)=>`<div class="h">${nums[i]!=null?String(nums[i]).padStart(2,'0'):''}</div>`).join('');for(const d of dates){let x=draws.get(key(d));$('chart').insertAdjacentHTML('beforeend',`<div>${fmt(d).slice(5)}</div>`);for(let i=0;i<10;i++){let n=nums[i],hit=n!=null&&(o.lastDigit?x.numbers.some(v=>v%10===n%10):x.numbers.includes(n));$('chart').insertAdjacentHTML('beforeend',`<div class="${hit?'hit':''}">${hit?'●':''}</div>`)}}$('chartCard').classList.remove('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setup(){let html='';for(let i=0;i<7;i++)html+=`<label><input type="checkbox" value="${i}" ${i<5?'checked':''}>${weekdayNames[i]}</label>`;$('weekdays').innerHTML=html;$('update').onclick=loadData;$('recent').onclick=showRecent;$('chartBtn').onclick=showChart;$('analyze').onclick=()=>analyze(false);$('miss').onclick=()=>analyze(true);$('backtest').onclick=backtest30;$('stop').onclick=()=>{running=false;token++;runEl.textContent='已中止';$('analyze').disabled=$('miss').disabled=$('backtest').disabled=false;$('stop').disabled=true};$('lottery').onchange=loadData;}
setup();$('cutoff').value=iso(new Date());loadData();
</script>
