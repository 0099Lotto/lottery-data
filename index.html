<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>數獵者｜綜合分析拖牌 Web</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#697386;--line:#dfe4ea;--pri:#1f6feb;--ok:#28a745;--warn:#fff4b8;--hit:#ffd166;--src:#b9e7c0;--target:#ffb4b4;--radius:14px;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:12px 14px 32px}.topbar{position:sticky;top:0;z-index:30;background:rgba(245,247,251,.96);backdrop-filter:blur(12px);padding:8px 0}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}.tabs button{flex:0 0 auto;padding:10px 14px;border-radius:10px;background:#e9edf3;color:#334155;font-weight:700}.tabs button.active{background:var(--pri);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:0 5px 18px rgba(30,50,80,.04)}.section-title{font-weight:800;font-size:16px;margin-bottom:10px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd4df;border-radius:10px;padding:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,111,235,.1)}textarea{min-height:74px;resize:vertical}.wide-input{font-size:17px;letter-spacing:.4px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{padding:4px 9px;border-radius:999px;background:#eef2f7;font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.switch{display:inline-flex;align-items:center;gap:8px}.switch input{width:20px;height:20px}.stars button{padding:8px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc}.stars button.on{background:var(--ok);color:#fff;border-color:var(--ok)}.btnrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.btn{padding:11px 12px;border-radius:10px;background:#e7ebf1;color:#172033;font-weight:800}.btn.primary{background:var(--pri);color:#fff}.btn.good{background:var(--ok);color:#fff}.btn.stop{background:#c62828;color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.status{font-size:13px;color:var(--muted);min-height:20px}.progress{height:9px;background:#e7ebf1;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--pri);width:0}.metric{display:flex;gap:10px;flex-wrap:wrap}.metric .m{padding:9px 11px;border-radius:10px;background:#f0f4f9;font-size:13px}.metric b{font-size:17px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.result-table{border-collapse:collapse;width:100%;min-width:760px}.result-table th,.result-table td{border-bottom:1px solid #edf0f4;padding:9px 10px;text-align:left;font-size:13px}.result-table th{background:#f7f9fc;position:sticky;top:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}.chart-wrap{overflow:auto;border:1px solid #cbd2da;border-radius:12px;background:#f0f0f0}.roadmap{display:flex;gap:10px;padding:10px;width:max-content}.road-block{background:#fff;border:1px solid #111;box-shadow:0 2px 8px rgba(0,0,0,.08)}.road-head{height:34px;background:#ffff00;display:grid;grid-template-columns:26px 26px 26px auto;border-bottom:1px solid #111}.road-head>div,.road-row>div{border-right:1px solid #111;display:flex;align-items:center;justify-content:center}.road-head>div:last-child,.road-row>div:last-child{border-right:0}.road-head span{font-size:12px}.road-row{height:28px;display:grid;grid-template-columns:26px 26px 26px auto;border-bottom:1px solid #111}.road-row:last-child{border-bottom:0}.road-row .month,.road-row .day,.road-row .week{font-size:11px;color:#111}.road-nums{display:grid;grid-auto-flow:column;grid-auto-columns:30px;justify-content:start;min-width:150px}.numcell{position:relative;font-size:13px;color:#111}.numcell.hit{background:var(--hit)}.numcell.target{background:var(--target);font-weight:900}.numcell.source{background:var(--src)}.numcell.circled:after{content:"";position:absolute;inset:3px;border:2px solid #111;border-radius:50%}.special{background:#d1e9ff}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.leg{display:flex;align-items:center;gap:5px}.dot{width:14px;height:14px;border:1px solid #999;border-radius:3px}.empty{padding:28px;color:var(--muted);text-align:center}.small{font-size:12px;color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:12px}.res-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fff}.res-card.best{border-color:#e7a600;box-shadow:0 0 0 2px rgba(255,209,102,.25)}
@media(max-width:720px){.app{padding:8px}.g2,.g3,.g4{grid-template-columns:1fr 1fr}.btnrow{grid-template-columns:1fr 1fr}.title{font-size:19px}.roadmap{padding:6px}.card{padding:12px}.result-table{min-width:680px}}
@media(max-width:460px){.g2,.g3,.g4,.btnrow{grid-template-columns:1fr}.road-nums{grid-auto-columns:29px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">🎯 數獵者｜綜合分析拖牌 Web</div>
    <div class="sub">Python 核心邏輯移植版｜資料直接讀取 GitHub 同目錄 CSV</div>
    <div class="tabs" id="tabs"><button data-tab="analysis" class="active">立柱／綜合分析</button><button data-tab="result">分析結果</button><button data-tab="roadmap">版路圖</button><button data-tab="backtest">30期回測</button></div>
  </div>

  <section id="tab-analysis">
    <div class="card">
      <div class="section-title">① 資料與當期</div>
      <div class="grid g4">
        <div class="field"><label>彩種</label><select id="lottoType"><option value="0">今彩539</option><option value="1">天天樂</option><option value="2">大樂透</option><option value="3">六合彩</option></select></div>
        <div class="field"><label>分析截止日期</label><input id="deadline" type="date"></div>
        <div class="field"><label>歷史期數上限</label><input id="maxPeriods" type="number" value="234" min="5" max="1000"></div>
        <div class="field"><label>目前資料</label><div id="dataStatus" class="status">尚未讀取</div></div>
      </div>
      <div class="btnrow" style="margin-top:10px"><button class="btn good" id="reloadBtn">↻ 重新讀取同位置 CSV</button><button class="btn ghost" id="prevBtn">← 上一期</button><button class="btn ghost" id="nextBtn">下一期 →</button><button class="btn ghost" id="latestBtn">最新一期</button></div>
      <div id="currentDraw" class="metric" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="section-title">② 開獎號碼輸入（單一寬輸入，不再逼你一格一格打）</div>
      <div class="field"><label>直接貼上，例如：01 05 12 23 39／01,05,12,23,39／01.05.12.23.39</label><input id="numberInput" class="wide-input" placeholder="請輸入本期號碼" /></div>
      <div id="numberChips" class="chips"></div>
      <div class="small">頁面會自動解析空格、逗號、頓號、點號、斜線、換行；分析時仍以原程式的固定球位與排序規則處理。</div>
    </div>

    <div class="card">
      <div class="section-title">③ 原程式核心設定</div>
      <div class="grid g4">
        <div class="field"><label>立柱數量 A</label><input id="c1" type="number" value="2" min="0"></div>
        <div class="field"><label>立柱數量 B</label><input id="c2" type="number" value="0" min="0"></div>
        <div class="field"><label>立柱數量 C</label><input id="c3" type="number" value="0" min="0"></div>
        <div class="field"><label>立柱數量 D</label><input id="c4" type="number" value="0" min="0"></div>
      </div>
      <div class="grid g3" style="margin-top:10px">
        <div class="field"><label>選號數量模式（原程式 select_count_switch）</label><div class="switch"><input id="selectCount" type="checkbox"><span>啟用連碰數量</span></div></div>
        <div class="field"><label>選號數量</label><input id="selectCountValue" type="number" value="3" min="1"></div>
        <div class="field"><label>檢查期數</label><input id="within" class="wide-input" value="1 2 3" placeholder="例如 1 2 3"></div>
      </div>
      <div style="margin-top:10px"><label class="small">最少命中星數（可複選）</label><div class="stars" id="stars"><button data-star="1" class="on">1星</button><button data-star="2">2星</button><button data-star="3">3星</button><button data-star="4">4星</button></div></div>
      <div class="grid g4" style="margin-top:10px">
        <label class="switch"><input id="forceLastMiss" type="checkbox"> 最新一期到期</label>
        <label class="switch"><input id="includeSpecial" type="checkbox"> 包含特別號</label>
        <label class="switch"><input id="fixedPosition" type="checkbox"> 定點分析</label>
        <label class="switch"><input id="tailMode" type="checkbox"> 尾數模式</label>
        <label class="switch"><input id="consecutive" type="checkbox"> 連號模式</label>
        <label class="switch"><input id="continuousHit" type="checkbox" checked> 連續命中模式</label>
        <label class="switch"><input id="dynamicBacktrack" type="checkbox"> 動態回溯拖牌</label>
        <label class="switch"><input id="backtestSwitch" type="checkbox"> 按分析按鈕直接回測</label>
      </div>
    </div>

    <div class="card">
      <div class="section-title">④ 分析</div>
      <div class="btnrow"><button class="btn primary" id="columnBtn">🗿 開始立柱分析</button><button class="btn good" id="compBtn">🧠 綜合分析</button><button class="btn stop" id="stopBtn">■ 停止</button><button class="btn ghost" id="chartBtn">🗺 目前結果→版路圖</button></div>
      <div id="status" class="status" style="margin:10px 0 6px">準備就緒</div><div class="progress"><i id="prog"></i></div>
    </div>
  </section>

  <section id="tab-result" class="hidden">
    <div class="card"><div class="section-title">分析結果</div><div id="resultSummary" class="metric"></div><div id="results"></div></div>
  </section>

  <section id="tab-roadmap" class="hidden">
    <div class="card"><div class="section-title">版路圖（60列 × 4區）</div><div class="small">黃色＝檢查窗口｜紅色＝觸發號碼｜綠色＝動態拖牌來源｜橙色圈＝命中。</div><div id="roadmap" class="chart-wrap" style="margin-top:10px"></div><div class="legend"><span class="leg"><i class="dot" style="background:#fff4b8"></i>檢查</span><span class="leg"><i class="dot" style="background:#ffb4b4"></i>觸發</span><span class="leg"><i class="dot" style="background:#b9e7c0"></i>來源</span><span class="leg"><i class="dot" style="background:#ffd166"></i>命中</span></div></div>
  </section>

  <section id="tab-backtest" class="hidden">
    <div class="card"><div class="section-title">30期自動回測</div><div class="grid g3"><div class="field"><label>回測期數</label><input id="btCount" type="number" value="30" min="1" max="100"></div><div class="field"><label>分析模式</label><select id="btMode"><option value="comprehensive">綜合</option><option value="column">立柱</option></select></div><div class="field"><label>每期最大迭代</label><input id="btIterations" type="number" value="250" min="20" max="1000"></div></div><button class="btn primary" id="runBt" style="margin-top:10px">▶ 執行回測</button><div id="btStatus" class="status" style="margin-top:8px"></div><div id="btResult"></div></div>
  </section>
</div>
<script>
const CFG={
  names:['今彩539','天天樂','大樂透','六合彩'], files:[['tw539.csv'],['us539.csv'],['rk8e49.csv'],['hkmark6.csv','hmark6.csv']], numCount:[5,5,6,6], maxNum:[39,39,49,49], special:[false,false,true,true]
};
let state={type:0,data:[],idx:-1,settings:null,result:null,running:false,stop:false};
const $=id=>document.getElementById(id);
function setStatus(t){$('status').textContent=t}
function parseNumbers(s){return (s||'').split(/[^0-9]+/).filter(Boolean).map(Number)}
function uniqueSorted(a){return [...new Set(a)].sort((a,b)=>a-b)}
function dateKey(d){return d.toISOString().slice(0,10)}
function fmtDate(d){return d.toISOString().slice(0,10)}
function parseDate(s){let p=s.trim().replaceAll('/','-').split('-');if(p.length!==3)return null;return new Date(+p[0],+p[1]-1,+p[2])}
function extractCsv(text,type){
  const rows=[]; const lines=text.split(/\r?\n/).filter(x=>x.trim());
  for(let k=0;k<lines.length;k++){
    const row=lines[k].split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.replace(/^\"|\"$/g,'').trim());
    if(k===0 && /date|日期/i.test(row[0]||'')) continue; if(row.length<CFG.numCount[type]+2) continue;
    let d=parseDate(row[0]); if(!d) continue; if(type===1)d.setDate(d.getDate()+1);
    const nums=row.slice(2,2+CFG.numCount[type]).filter(x=>/^\d+$/.test(x)).map(Number); if(nums.length!==CFG.numCount[type])continue;
    if(nums.some(n=>n<1||n>CFG.maxNum[type]))continue; nums.sort((a,b)=>a-b);
    let sp=null; if(CFG.special[type] && row.length>CFG.numCount[type]+2 && /^\d+$/.test(row[CFG.numCount[type]+2])){sp=+row[CFG.numCount[type]+2];if(!(sp>=1&&sp<=CFG.maxNum[type]))sp=null}
    rows.push({date:d,nums,special:sp});
  }
  const seen=new Set(); return rows.filter(r=>{let k=dateKey(r.date);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.date-b.date)
}
async function readFileCandidates(cands){for(const f of cands){try{const r=await fetch('./'+f+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.text()}catch(e){}}throw new Error('找不到 CSV')}
async function loadData(){
  const type=+$('lottoType').value; $('dataStatus').textContent='讀取中…';
  try{const text=await readFileCandidates(CFG.files[type]);const data=extractCsv(text,type);if(!data.length)throw new Error('CSV 沒有可解析資料');state.type=type;state.data=data;state.idx=data.length-1;$('deadline').value=fmtDate(data[data.length-1].date);showCurrent();$('dataStatus').textContent=`已載入 ${data.length} 期｜${CFG.files[type].join(' / ')}`;setStatus('資料讀取完成')}catch(e){$('dataStatus').textContent='讀取失敗';setStatus('⚠️ '+e.message+'；請確認 index.html 與 CSV 在同一層')}}
function showCurrent(){if(!state.data.length)return;const r=state.data[state.idx];$('currentDraw').innerHTML=`<div class="m">日期 <b>${fmtDate(r.date)}</b></div><div class="m">號碼 <b class="mono">${r.nums.map(n=>String(n).padStart(2,'0')).join(' ')}</b></div>${r.special!=null?`<div class="m">特別號 <b>${String(r.special).padStart(2,'0')}</b></div>`:''}`;$('numberInput').value=r.nums.map(n=>String(n).padStart(2,'0')).join(' ')+(r.special!=null?' '+String(r.special).padStart(2,'0'):'');renderChips()}
function renderChips(){const nums=parseNumbers($('numberInput').value);$('numberChips').innerHTML=uniqueSorted(nums).map(n=>`<span class="chip">${String(n).padStart(2,'0')}</span>`).join('')}
function getSettings(){
  return {type:+$('lottoType').value,deadline:new Date($('deadline').value+'T00:00:00'),maxPeriods:+$('maxPeriods').value||234,selectCount:$('selectCount').checked,pickCount:+$('selectCountValue').value||3,counts:[+$('c1').value||0,+$('c2').value||0,+$('c3').value||0,+$('c4').value||0],within:uniqueSorted(parseNumbers($('within').value)).filter(n=>n>0),minStars:[...document.querySelectorAll('#stars button.on')].map(x=>+x.dataset.star),forceLastMiss:$('forceLastMiss').checked,includeSpecial:$('includeSpecial').checked,fixedPosition:$('fixedPosition').checked,tailMode:$('tailMode').checked,consecutive:$('consecutive').checked,continuousHit:$('continuousHit').checked,dynamic:$('dynamicBacktrack').checked};
}
function setTab(name){document.querySelectorAll('[id^="tab-"]').forEach(x=>x.classList.add('hidden'));$('tab-'+name).classList.remove('hidden');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}
function validSet(draw,s){let a=new Set(draw.nums);if(s.includeSpecial&&draw.special!=null)a.add(draw.special);if(s.tailMode)a=new Set([...a].map(n=>n%10));return a}
function getTargetNums(s){let nums=parseNumbers($('numberInput').value);let max=s.tailMode?9:CFG.maxNum[s.type];nums=nums.filter(n=>s.tailMode?n>=0&&n<=99:n>=1&&n<=max);return uniqueSorted(nums)}
function getAnalysis(s){let data=state.data.filter(r=>r.date<=s.deadline);if(!data.length)throw Error('截止日期前沒有資料');let idx=data.length-1;return {data,idx,start:Math.max(0,idx-s.maxPeriods+1)}}
function makeCandidateColumns(valid,counts,s){const total=counts.reduce((a,b)=>a+b,0);if(!total)return null;const out=[];if(s.consecutive){let used=new Set();for(const c of counts){if(c<=0)continue;if(c===1){let av=valid.filter(n=>!used.has(n));if(!av.length)return null;let n=av[Math.floor(Math.random()*av.length)];used.add(n);out.push([n])}else{let ok=null;for(let t=0;t<100;t++){let start=s.tailMode?Math.floor(Math.random()*(10-c+1)):1+Math.floor(Math.random()*(CFG.maxNum[s.type]-c+1));let ar=Array.from({length:c},(_,i)=>start+i);if(ar.every(n=>!used.has(n))){ok=ar;break}}if(!ok)return null;ok.forEach(n=>used.add(n));out.push(ok)}}}else{const pool=[...valid];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let p=0;for(const c of counts.filter(x=>x>0)){out.push(pool.slice(p,p+c).sort((a,b)=>a-b));p+=c}}return out}
function scoreColumns(columns, targetNums, analysisData, fullData, idx,s){
  const sets=analysisData.map(r=>validSet(r,s)); const fullSets=fullData.map(r=>validSet(r,s));
  const indexMap={};for(const n of targetNums){let arr=[];for(let i=0;i<analysisData.length;i++){const d=analysisData[i];let hit;if(s.fixedPosition){let targetIndex=parseNumbers($('numberInput').value).indexOf(n);hit=targetIndex>=0&&d.nums[targetIndex]===n;if(CFG.special[s.type]&&targetIndex===d.nums.length&&d.special===n)hit=true}else hit=d.nums.includes(n)||(s.includeSpecial&&d.special===n);if(hit)arr.push(i)}arr=arr.reverse();if(arr.length)arr=arr.slice(1);indexMap[n]=arr}
  const colSets=columns.map(c=>new Set(c));const scores={},stars={};
  if(s.forceLastMiss){for(const j of s.within){const k=idx+j;if(k>=fullSets.length)break;let hit=0;for(const c of colSets)if([...c].some(x=>fullSets[k].has(x)))hit++;if(s.minStars.length&&hit>=Math.min(...s.minStars))return null}}
  for(const n of targetNums){let sc=0,st=0;for(const i of indexMap[n]||[]){let any=false,cur=0;for(const j of s.within){if(i+j>=sets.length)break;let hits=0;for(const c of colSets)if([...c].some(x=>sets[i+j].has(x)))hits++;let eff=s.minStars.includes(hits)?hits:0;cur+=eff;if(eff>0)any=true}if(any){sc++;st+=cur}else if(s.continuousHit)break}scores[n]=sc;stars[n]=st}
  return {scores,stars,total:Object.values(scores).reduce((a,b)=>a+b,0),starTotal:Object.values(stars).reduce((a,b)=>a+b,0)}
}
function dynamicPredict(s,fullData,idx,targetNums){const balls=CFG.numCount[s.type]+(CFG.special[s.type]?1:0);const fullSets=fullData.map(r=>validSet(r,s));const out={},pred=new Set();for(const n of targetNums){let patterns=[];for(let back=1;back<=5;back++){for(let pos=0;pos<balls;pos++){let streak=0;for(let i=idx;i>=0;i--){let triggered=false;const sourceIndex=i-back;if(sourceIndex<0)break;let future=new Set();let has=false;for(const off of s.within){const k=i+off;if(k<fullSets.length){has=true;for(const x of fullSets[k])future.add(x)}}if(!has)continue;const d=fullData[sourceIndex];let raw=pos<d.nums.length?d.nums[pos]:d.special;if(raw!=null){let v=s.tailMode?raw%10:raw;if(future.has(v))triggered=true}if(triggered)streak++;else break}if(s.forceLastMiss){const src=idx-back;if(src>=0){const d=fullData[src];let raw=pos<d.nums.length?d.nums[pos]:d.special;if(raw!=null){let v=s.tailMode?raw%10:raw;if(s.within.some(off=>idx+off<fullSets.length&&fullSets[idx+off].has(v)))continue}}}patterns.push({streak,back,pos})}}patterns.sort((a,b)=>b.streak-a.streak);let top=patterns.slice(0,s.selectCount?s.pickCount:1);out[n]=top;for(const p of top){let k=idx-p.back;if(k>=0){let d=fullData[k];let raw=p.pos<d.nums.length?d.nums[p.pos]:d.special;if(raw!=null)pred.add(s.tailMode?raw%10:raw)}}}return {predictions:[...pred].sort((a,b)=>a-b),patterns:out,scores:Object.fromEntries(targetNums.map(n=>[n,(out[n]?.[0]?.streak||0)])),stars:Object.fromEntries(targetNums.map(n=>[n,(out[n]?.[0]?.streak||0)]))}}
async function columnAnalyze(s){const {data,idx,start}=getAnalysis(s);let targetNums=getTargetNums(s);if(!targetNums.length)throw Error('請輸入有效號碼');let counts=s.selectCount?Array.from({length:s.pickCount},()=>1):s.counts.filter(x=>x>0);if(!counts.length)throw Error('請設定立柱數量');let valid=s.tailMode?Array.from({length:10},(_,i)=>i):Array.from({length:CFG.maxNum[s.type]},(_,i)=>i+1);if(counts.reduce((a,b)=>a+b,0)>valid.length)throw Error('立柱總數超出可用號碼');
  if(s.dynamic){const r=dynamicPredict(s,data,idx,targetNums);state.result={mode:'column-dynamic',columns:[r.predictions],columnsByNum:Object.fromEntries(targetNums.map(n=>[n,r.predictions])),scores:r.scores,stars:r.stars,patterns:r.patterns,targetNums};return state.result}
  const analysisData=data.slice(start,idx+1);const best={};for(const n of targetNums)best[n]={score:0,stars:0,columns:[]};const iterations=Math.min(1000,Math.max(20,+$('btIterations').value||250));
  for(let it=1;it<=iterations && !state.stop;it++){let pop=200;for(let q=0;q<pop;q++){const cols=makeCandidateColumns(valid,counts,s);if(!cols)continue;const sc=scoreColumns(cols,targetNums,analysisData,data,idx,s);if(!sc)continue;for(const n of targetNums){if(sc.scores[n]>best[n].score || (sc.scores[n]===best[n].score&&sc.stars[n]>best[n].stars))best[n]={score:sc.scores[n],stars:sc.stars[n],columns:cols}}}if(it%5===0||it===iterations){$('prog').style.width=(it/iterations*100)+'%';setStatus(`立柱分析 ${it}/${iterations}｜最佳分數 ${Math.max(...targetNums.map(n=>best[n].score))}`);await new Promise(r=>setTimeout(r,0))}}
  const scores=Object.fromEntries(targetNums.map(n=>[n,best[n].score]));const stars=Object.fromEntries(targetNums.map(n=>[n,best[n].stars]));state.result={mode:'column',columns:[],columnsByNum:Object.fromEntries(targetNums.map(n=>[n,best[n].columns||[]])),scores,stars,targetNums};return state.result}
async function comprehensiveAnalyze(s){const {data,idx,start}=getAnalysis(s);let targetNums=data[idx].nums.slice();if(s.includeSpecial&&data[idx].special!=null)targetNums.push(data[idx].special);if(s.tailMode)targetNums=uniqueSorted(targetNums.map(n=>n%10));let counts=s.selectCount?Array.from({length:s.pickCount},()=>1):s.counts.filter(x=>x>0);if(!counts.length)throw Error('請設定立柱數量');let valid=s.tailMode?Array.from({length:10},(_,i)=>i):Array.from({length:CFG.maxNum[s.type]},(_,i)=>i+1);let best={total:-1,starTotal:-1,columns:[],scores:{},stars:{}};const iterations=Math.min(1000,Math.max(20,+$('btIterations').value||250));const analysisData=data.slice(start,idx+1);
  if(s.dynamic){const r=dynamicPredict(s,data,idx,targetNums);state.result={mode:'comprehensive-dynamic',columns:[r.predictions],columnsByNum:Object.fromEntries(targetNums.map(n=>[n,r.predictions])),scores:r.scores,stars:r.stars,patterns:r.patterns,targetNums};return state.result}
  for(let it=1;it<=iterations && !state.stop;it++){for(let q=0;q<200;q++){const cols=makeCandidateColumns(valid,counts,s);if(!cols)continue;const sc=scoreColumns(cols,targetNums,analysisData,data,idx,s);if(!sc)continue;if(sc.total>best.total||(sc.total===best.total&&sc.starTotal>best.starTotal))best={total:sc.total,starTotal:sc.starTotal,columns:cols,scores:sc.scores,stars:sc.stars}}if(it%5===0||it===iterations){$('prog').style.width=(it/iterations*100)+'%';setStatus(`綜合分析 ${it}/${iterations}｜總命中 ${best.total}｜總星 ${best.starTotal}`);await new Promise(r=>setTimeout(r,0))}}
  state.result={mode:'comprehensive',columns:[best.columns],columnsByNum:Object.fromEntries(targetNums.map(n=>[n,best.columns])),scores:best.scores,stars:best.stars,targetNums};return state.result}
function resultHTML(r){if(!r)return '<div class="empty">尚無結果</div>';let max=Math.max(...Object.values(r.scores).map(Number),0);let cols=(r.columns?.[0]||[]).map(c=>`(${c.map(n=>state.settings.tailMode?n+'尾':String(n).padStart(2,'0')).join('、')})`).join('、')||'無';let h=`<div class="metric"><div class="m">模式 <b>${r.mode}</b></div><div class="m">總命中 <b>${Object.values(r.scores).reduce((a,b)=>a+b,0)}</b></div><div class="m">總星 <b>${Object.values(r.stars).reduce((a,b)=>a+b,0)}</b></div><div class="m">最佳組合 <b>${cols}</b></div></div>`;h+=`<div class="res-card ${max>0?'best':''}"><b>最佳立柱/預測</b><div class="mono" style="margin-top:6px">${cols}</div></div>`;h+=`<div class="table-wrap"><table class="result-table"><thead><tr><th>號碼</th><th>命中</th><th>總星</th><th>拖牌來源</th><th>操作</th></tr></thead><tbody>`;for(const n of r.targetNums||Object.keys(r.scores).map(Number)){const pat=r.patterns?.[n]||[];h+=`<tr><td><b>${String(n).padStart(2,'0')}</b>${r.scores[n]===max?' ★':''}</td><td>${r.scores[n]||0}</td><td>${r.stars[n]||0}</td><td>${pat.length?pat.map(p=>`回${p.back}期/第${p.pos+1}球/連${p.streak}`).join('、'):'—'}</td><td><button class="btn ghost" onclick="focusRoadmap(${n})">看版路</button></td></tr>`}h+='</tbody></table></div>';return h}
function buildRoadmap(target){const r=state.result,s=state.settings;if(!r||!state.data.length){$('roadmap').innerHTML='<div class="empty">先完成分析</div>';return}const cutoff=s.deadline;let arr=state.data.filter(d=>d.date<=cutoff);if(arr.length>231)arr=arr.slice(-231);let total=60*4;while(arr.length<total){let last=arr[arr.length-1]?.date||new Date();let d=new Date(last);d.setDate(d.getDate()+1);while(!drawDayAllowed(d,s.type))d.setDate(d.getDate()+1);arr.push({date:d,nums:[],special:null})}
  const rawCols=target!=null?(r.columnsByNum?.[target]||[]):(r.columns||[]);const pred=new Set([].concat(...rawCols));const trig=new Set(target==null?(r.targetNums||[]):[target]);const patterns=r.patterns||{};const source=new Set();if(target!=null){for(const p of (patterns[target]||[])){let k=state.data.findIndex(x=>x.date<=cutoff)-p.back;if(k>=0){let d=state.data[k];let raw=p.pos<d.nums.length?d.nums[p.pos]:d.special;if(raw!=null)source.add(s.tailMode?raw%10:raw)}}}
  const chunks=[];for(let c=0;c<4;c++)chunks.push(arr.slice(c*60,c*60+60));$('roadmap').innerHTML='<div class="roadmap">'+chunks.map(chunk=>'<div class="road-block"><div class="road-head"><div><span>月</span></div><div><span>日</span></div><div><span>週</span></div><div><span>'+CFG.names[s.type]+'</span></div></div>'+chunk.map(d=>{const hitCheck=new Set();let rowBg='';if(state.data.find(x=>dateKey(x.date)===dateKey(d.date))){for(const off of s.within){const ix=state.data.findIndex(x=>dateKey(x.date)===dateKey(d.date))+off;if(ix>=0&&ix<state.data.length){for(const n of validSet(state.data[ix],s))hitCheck.add(n)}}}let nums=CFG.numCount[s.type]===6?[...d.nums,...(d.special!=null?[d.special]:[])]:[...d.nums];nums=nums.slice(0,CFG.special[s.type]?7:5);while(nums.length<(CFG.special[s.type]?7:5))nums.push(null);return '<div class="road-row" style="background:'+(hitCheck.size?'#fff4b8':'#fff')+'"><div class="month">'+(d.date.getMonth()+1)+'</div><div class="day">'+String(d.date.getDate()).padStart(2,'0')+'</div><div class="week">'+['日','一','二','三','四','五','六'][d.date.getDay()]+'</div><div class="road-nums">'+nums.map((n,i)=>{if(n==null)return '<div class="numcell"></div>';let v=s.tailMode?n%10:n;let cls='numcell';if(trig.has(v)||trig.has(n))cls+=' target';if(source.has(v)||source.has(n))cls+=' source';if(pred.has(v)||pred.has(n))cls+=' circled';if(i===6&&CFG.special[s.type])cls+=' special';return `<div class="${cls}">${String(n).padStart(2,'0')}</div>`}).join('')+'</div></div>'}).join('')+'</div>').join('')+'</div>';}
function drawDayAllowed(d,type){const wd=d.getDay();return type===0?[0,1,2,3,4,5].includes(wd):type===1?true:type===2?[1,4].includes(wd):[1,3,5].includes(wd)}
function focusRoadmap(n){setTab('roadmap');buildRoadmap(n)}
async function runAnalysis(mode){if(state.running){setStatus('分析進行中');return}state.running=true;state.stop=false;$('columnBtn').disabled=true;$('compBtn').disabled=true;$('prog').style.width='0%';try{state.settings=getSettings();let r;if(mode==='column')r=await columnAnalyze(state.settings);else r=await comprehensiveAnalyze(state.settings);if(state.stop){setStatus('已停止');return}state.result=r;$('results').innerHTML=resultHTML(r);$('resultSummary').innerHTML=`<div class="m">${CFG.names[state.type]}</div><div class="m">${r.mode}</div><div class="m">最佳總命中 <b>${Object.values(r.scores).reduce((a,b)=>a+b,0)}</b></div>`;buildRoadmap();setTab('result');setStatus('分析完成')}catch(e){setStatus('⚠️ '+e.message)}finally{state.running=false;$('columnBtn').disabled=false;$('compBtn').disabled=false}}
async function runBacktest(){if(!state.data.length)return;const count=Math.min(100,+$('btCount').value||30);const mode=$('btMode').value;const originalIdx=state.idx;let rows=[];$('btStatus').textContent='回測中…';for(let step=0;step<count && step<=originalIdx;step++){if(state.stop)break;state.idx=originalIdx-step;showCurrent();const d=state.data[state.idx];$('deadline').value=fmtDate(d.date);try{const s=getSettings();let r=mode==='column'?await columnAnalyze({...s,deadline:d.date}):await comprehensiveAnalyze({...s,deadline:d.date});const total=Object.values(r.scores).reduce((a,b)=>a+b,0);rows.push({date:fmtDate(d.date),total,stars:Object.values(r.stars).reduce((a,b)=>a+b,0),r})}catch(e){rows.push({date:fmtDate(d.date),error:e.message})}$('btStatus').textContent=`回測 ${step+1}/${count}`;await new Promise(r=>setTimeout(r,0))}state.idx=originalIdx;showCurrent();$('btResult').innerHTML='<div class="table-wrap" style="margin-top:10px"><table class="result-table"><thead><tr><th>期數</th><th>命中</th><th>總星</th><th>結果</th></tr></thead><tbody>'+rows.map((x,i)=>`<tr><td>${x.date}</td><td>${x.total??0}</td><td>${x.stars??0}</td><td>${x.error?'❌ '+x.error:(x.total>0?'⭕':'❌')}</td></tr>`).join('')+'</tbody></table></div>';setTab('backtest')}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});
$('reloadBtn').onclick=loadData;$('lottoType').onchange=loadData;$('prevBtn').onclick=()=>{if(state.idx>0){state.idx--;showCurrent()}};$('nextBtn').onclick=()=>{if(state.idx<state.data.length-1){state.idx++;showCurrent()}};$('latestBtn').onclick=()=>{state.idx=state.data.length-1;showCurrent()};$('numberInput').addEventListener('input',renderChips);document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');if(!document.querySelector('#stars button.on'))b.classList.add('on')});$('columnBtn').onclick=()=>$('backtestSwitch').checked?runBacktest():runAnalysis('column');$('compBtn').onclick=()=>$('backtestSwitch').checked?runBacktest():runAnalysis('comprehensive');$('stopBtn').onclick=()=>{state.stop=true;state.running=false;setStatus('停止要求已送出')};$('chartBtn').onclick=()=>{if(!state.result){setStatus('請先分析');return}state.settings=getSettings();buildRoadmap();setTab('roadmap')};$('runBt').onclick=runBacktest;
loadData();
</script>
