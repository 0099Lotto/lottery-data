<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星辰路引</title>
<meta name="description" content="星辰路引 —— 開獎資料整理與版路比對工具">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>

<header class="hero">
  <svg class="hero__constellation" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <line x1="20" y1="60" x2="55" y2="25"/>
    <line x1="55" y1="25" x2="90" y2="45"/>
    <line x1="90" y1="45" x2="130" y2="15"/>
    <line x1="130" y1="15" x2="160" y2="40"/>
    <line x1="160" y1="40" x2="185" y2="20"/>
    <line x1="90" y1="45" x2="100" y2="65"/>
    <circle cx="20" cy="60" r="2.5"/>
    <circle cx="55" cy="25" r="3"/>
    <circle cx="90" cy="45" r="3.5"/>
    <circle cx="130" cy="15" r="2.5"/>
    <circle cx="160" cy="40" r="3"/>
    <circle cx="185" cy="20" r="2.5"/>
    <circle cx="100" cy="65" r="2"/>
  </svg>
  <h1 class="hero__title">星辰路引</h1>
  <p class="hero__tagline">整理開獎資料,依你設定的版路規則比對走勢</p>
</header>

<nav class="lotto-picker" aria-label="選擇彩種">
  <button class="lotto-picker__btn is-active" data-lotto="0">台灣539</button>
  <button class="lotto-picker__btn" data-lotto="1">天天樂</button>
  <button class="lotto-picker__btn" data-lotto="2">大樂透</button>
  <button class="lotto-picker__btn" data-lotto="3">六合彩</button>
</nav>

<nav class="tabs" aria-label="功能分頁">
  <button class="tabs__btn is-active" data-tab="data">資料</button>
  <button class="tabs__btn" data-tab="settings">參數設定</button>
  <button class="tabs__btn" data-tab="results">分析結果</button>
  <button class="tabs__btn" data-tab="smart">智能彩引</button>
  <button class="tabs__btn" data-tab="chart">圖表</button>
</nav>

<main class="panel">
  <section class="tab-content" id="tab-data" data-tab-content="data"></section>

  <section class="tab-content" id="tab-settings" data-tab-content="settings" hidden></section>

  <section class="tab-content" id="tab-results" data-tab-content="results" hidden></section>

  <section class="tab-content" id="tab-smart" data-tab-content="smart" hidden></section>

  <section class="tab-content" data-tab-content="chart" hidden>
    <p class="empty-note">
      版路圖會畫在這裡,呈現號碼之間的拖牌走勢,對應原本 App 的星形與六角星圖案。
      這部分排在下一階段開發。
    </p>
  </section>
</main>

<footer class="status-bar" id="statusBar">準備就緒</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/dateUtils.js"></script>
<script src="js/dataLoader.js"></script>
<script src="js/engineBridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
