<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>樂透週牌分析｜GitHub Pages 完整移植版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
:root{--bg:#eef3f8;--card:#fff;--line:#d7dee8;--ink:#243447;--muted:#718096;--blue:#1f4e79;--green:#28a745;--red:#dc3545;--purple:#6d28d9;--orange:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:linear-gradient(135deg,#173a5e,#2e526f);color:#fff;padding:18px 14px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;font-size:12px;opacity:.86}
main{max-width:1180px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px #0000000a;padding:14px;margin:0 0 12px}.section-title{font-size:18px;font-weight:700;color:#1f3b5b;margin:0 0 4px}.section-sub{font-size:12px;color:var(--muted);margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:13px;color:#56657a;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;font-size:14px;padding:10px;border:1px solid #ccd6e2;border-radius:9px;background:#fbfcfe;color:var(--ink)}
.weekdays{display:flex;flex-wrap:wrap;gap:6px}.wd{border:1px solid #ccd6e2;border-radius:9px;padding:7px 10px;font-size:13px;background:#f4f7fa;cursor:pointer}.wd.on{background:var(--green);color:#fff;border-color:#238b38}.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}.switch input{width:18px;height:18px;margin:0}.toolbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}button{border:1px solid #173b5c;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.green{background:var(--green);border-color:#238b38}button.red{background:var(--red);border-color:#a52a36}button.purple{background:var(--purple);border-color:#5520a8}button.orange{background:var(--orange);border-color:#c97b00}button.gray{background:#64748b;border-color:#475569}button.black{background:#1f2937;border-color:#111827}
.modebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{padding:7px 10px;border:1px solid var(--line);background:#f6f8fb;border-radius:999px;font-size:12px}.pill strong{color:#1f3b5b}
#status{white-space:pre-wrap;font-size:13px;line-height:1.5;background:#f6f8fb;border:1px solid #e2e8f0;padding:10px;border-radius:10px;min-height:42px}#progress{font-size:12px;color:#64748b;margin:7px 0}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:620px;overflow:auto}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px;font-size:13px;text-align:center}th,td{padding:8px 6px;border-bottom:1px solid #edf1f5;white-space:nowrap}th{background:var(--blue);color:#fff;position:sticky;top:0}tr:nth-child(even) td{background:#fafcff}.ball{display:inline-flex;width:29px;height:29px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;margin:1px;font-weight:700;font-size:12px}.ball.special{background:var(--red)}
.star{font-weight:700}.hit{color:#16803c}.miss{color:#c92a2a}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inline{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.small{width:78px!important;text-align:center}.hide{display:none!important}.history-item{border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:7px;background:#fafcff}.history-item strong{color:#1f3b5b}.history-item button{margin-top:7px;padding:7px 10px;font-size:12px}
#chartCanvas{width:100%;height:auto;border:1px solid #ccc;background:#fff;display:block}.legend{font-size:12px;color:#64748b;line-height:1.5;margin-top:8px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){main{padding:8px}.grid,.settings-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}header h1{font-size:19px}}
</style>
</head>
<body>
<header><h1>🎯 樂透週牌分析</h1><p>GitHub Pages 完整移植版｜源自週牌版路圖(1).py</p></header>
<main>
<section class="card">
  <div class="section-title">1 基本玩法</div><div class="section-sub">保留原 Python 程式的彩種、立柱／輪碰、尾數、連號設定。</div>
  <div class="grid">
    <div class="field"><label>樂透類型</label><select id="lottery"><option value="0">今彩539</option><option value="1">天天樂</option><option value="2">大樂透</option><option value="3">六合彩</option></select></div>
    <div class="field"><label>預測模式</label><select id="mode"><option value="0">立柱模式</option><option value="1">輪碰模式</option></select></div>
    <div class="field"><label>截止日期</label><input id="cutoff" type="date"></div>
    <div class="field"><label>回測每輪秒數</label><input id="btSeconds" type="number" min="1" value="2"></div>
  </div>
  <div class="settings-grid" style="margin-top:10px">
    <div class="field" id="pillarBox"><label>立柱配置（最多 4 柱）</label><div class="inline"><input class="small pillar" value="2"><input class="small pillar" value="2"><input class="small pillar" value="2"><input class="small pillar" value="2"></div></div>
    <div class="field"><label>輪碰選號數量</label><input id="numNumbers" type="number" min="1" max="49" value="5"></div>
  </div>
  <div style="margin-top:10px"><label style="font-size:13px;color:#56657a">最低中星數</label><div class="modebar" id="stars"></div></div>
  <div class="settings-grid" style="margin-top:10px">
    <label class="switch"><input id="lastDigit" type="checkbox">尾數模式</label>
    <label class="switch"><input id="consecutive" type="checkbox">連號模式</label>
    <label class="switch"><input id="includeSpecial" type="checkbox">包含特別號</label>
    <label class="switch"><input id="allPass" type="checkbox">全過關模式</label>
    <label class="switch"><input id="latestMiss" type="checkbox">到期模式</label>
    <label class="switch"><input id="threePeriod" type="checkbox">3期中一次</label>
    <label class="switch"><input id="breakMode" type="checkbox">斷幾期模式</label>
    <label class="switch"><input id="excludeToday" type="checkbox">排除截止日開獎</label>
  </div>
  <div class="settings-grid" style="margin-top:10px">
    <div class="field"><label>空幾期（3期中一次）</label><select id="skip"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
    <div class="field"><label>斷幾期</label><select id="break"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
  </div>
  <div style="margin-top:12px"><label style="font-size:13px;color:#56657a">分析星期</label><div class="weekdays" id="weekdays"></div></div>
  <div class="toolbar">
    <button id="analyze">開始分析</button><button id="missAnalyze" class="red">不出分析</button><button id="stop" class="black" disabled>中止分析</button>
    <button id="update" class="green">更新資料</button><button id="recent" class="purple">近10期開獎</button><button id="chart" class="orange">版路分析圖</button>
  </div>
  <div class="toolbar" style="margin-top:8px">
    <button id="backtest" class="purple">🧪 執行回測</button><button id="history" class="orange">📜 回測歷史版路</button><button id="downloadChart" class="gray">💾 圖片下載</button>
  </div>
</section>

<section class="card"><div class="section-title">資料狀態</div><div id="status">尚未載入</div><div id="progress"></div></section>
<section class="card"><div class="section-title">分析輸出</div><pre id="output">尚未分析</pre></section>
<section class="card"><div class="section-title" id="tableTitle">資料表</div><div class="table-wrap" id="tableWrap"></div></section>
<section class="card"><div class="section-title">版路分析圖</div><canvas id="chartCanvas" width="1200" height="1800"></canvas><div class="legend">圖表保留原程式的 60 列 × 4 欄概念；藍色表示命中，淡藍表示回測驗證目標日期，綠／黃交替表示分析群組。</div></section>
<section class="card"><div class="section-title">回測歷史</div><div id="historyBox">尚無回測紀錄</div></section>
</main>
<script>
'use strict';
const CFG={
  0:{name:'今彩539',file:'tw539.csv',max:39,balls:5,defaults:[4,5],valid:[0,1,2,3,4,5,6]},
  1:{name:'天天樂',file:'us539.csv',max:39,balls:5,defaults:[4,5,6],valid:[0,1,2,3,4,5,6]},
  2:{name:'大樂透',file:'rk8e49.csv',max:49,balls:7,defaults:[1,4],valid:[1,4]},
  3:{name:'六合彩',file:'hkmark6.csv',max:49,balls:7,defaults:[4,5,6],valid:[1,3,5,6]}
};
const WEEK=['週一','週二','週三','週四','週五','週六','週日'];
const MAX_WEEKS=40,MAX_WEEKS_THREE=100,CHART_ROWS=60,CHART_COLS=4,CHART_DISPLAY_LIMIT=228,POPULATION_SIZE=200,NO_IMPROVEMENT_LIMIT=200,MAX_GENERATIONS_TO_RUN=200,STREAK_THRESHOLD=35,TOURNAMENT_SIZE=7;
let S={lottery:0,mode:0,minStars:[2],weekdays:[4,5],cutoff:null,includeSpecial:false,allPassMode:true,latestMissMode:false,threePeriodMode:false,skipPeriods:0,breakPeriodMode:false,breakPeriods:1,excludeToday:false,consecutiveMode:false,lastDigitMode:false,numNumbers:5,columnConfig:[2,2,2,2]};
let draws=new Map(),isRunning=false,runToken=0,generation=0,resetCount=0,bestScore=[-1,-Infinity,Infinity],globalBestCombo=null,globalBestDetail=[],bestColumnConfig=null,backtestHistory=[],lastChartPayload=null,missMode=false;
const $=id=>document.getElementById(id); const status=t=>{$('status').textContent=t}; const output=t=>{$('output').textContent=t};
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){s=String(s||'').trim().replaceAll('/','-');const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d}
function fromDateKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function dateKey(d){return fmtDate(d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayIdx(d){return (d.getDay()+6)%7}
function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}
function sample(a,n){const b=a.slice();const out=[];while(out.length<n&&b.length){out.push(b.splice(Math.floor(Math.random()*b.length),1)[0])}return out}
function intersection(a,b){const B=new Set(b);return a.filter(x=>B.has(x))}
function uniq(a){return [...new Set(a)]}
function std(a){if(!a.length)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)}
function setUiDefaults(){
  $('cutoff').value=todayStr(); renderStars(); renderWeekdays(); updateModeUI();
}
function renderStars(){const max=CFG[S.lottery].max===49?6:5;const c=$('stars');c.innerHTML='';for(let i=1;i<=max;i++){const b=document.createElement('button');b.type='button';b.textContent=i+'星';b.dataset.v=i;b.className=S.minStars.includes(i)?'green':'';b.onclick=()=>{if(S.minStars.includes(i)){if(S.minStars.length===1)return;S.minStars=S.minStars.filter(x=>x!==i)}else S.minStars.push(i);S.minStars.sort();renderStars()};c.appendChild(b)}}
function renderWeekdays(){const c=$('weekdays');c.innerHTML='';for(let i=0;i<7;i++){const b=document.createElement('button');b.type='button';b.className='wd '+(S.weekdays.includes(i)?'on':'');b.textContent=WEEK[i];b.onclick=()=>{if(S.weekdays.includes(i)){if(S.weekdays.length===1)return;S.weekdays=S.weekdays.filter(x=>x!==i)}else S.weekdays.push(i);S.weekdays.sort();renderWeekdays()};c.appendChild(b)}}
function syncState(){
  S.lottery=+$('lottery').value;S.mode=+$('mode').value;S.cutoff=parseDate($('cutoff').value)||new Date();S.includeSpecial=$('includeSpecial').checked;S.allPassMode=$('allPass').checked;S.latestMissMode=$('latestMiss').checked;S.threePeriodMode=$('threePeriod').checked;S.skipPeriods=+$('skip').value;S.breakPeriodMode=$('breakMode').checked;S.breakPeriods=+$('break').value;S.excludeToday=$('excludeToday').checked;S.consecutiveMode=$('consecutive').checked;S.lastDigitMode=$('lastDigit').checked;S.numNumbers=+$('numNumbers').value||5;S.columnConfig=[...document.querySelectorAll('.pillar')].map(x=>parseInt(x.value)||0);bestColumnConfig=S.columnConfig.slice();updateModeUI();
}
function updateModeUI(){
  const bump=+$('mode').value===1;document.querySelectorAll('.pillar').forEach(x=>x.disabled=bump);$('pillarBox').style.opacity=bump?.55:1;
  const max=CFG[+$('lottery').value].max; if(+$('numNumbers').value>max)$('numNumbers').value=CFG[+$('lottery').value].balls===7?6:5;
  document.querySelectorAll('#stars button').forEach((b,i)=>{b.style.display=i<=(max===49?5:4)?'':'none'});
}
function parseCSVText(text,lottery,cutoff,three){
  const rows=Papa.parse(text,{header:false,skipEmptyLines:true}).data;const out=new Map();const expected=lottery<2?7:8;const max=CFG[lottery].max;const cutoffD=cutoff?dateKey(cutoff):null;let arr=[];
  for(const r of rows){if(!r||r.length<expected)continue;let d=parseDate(r[0]);if(!d)continue;if(cutoffD&&dateKey(d)>cutoffD)continue;if(lottery===1)d=addDays(d,1);
    const nums=r.slice(2,lottery<2?7:8).map(x=>parseInt(String(x).trim(),10));if(nums.some(n=>!Number.isFinite(n)||n<1||n>max))continue;let special=null;const sp=r[lottery<2?7:8];if(sp!==undefined&&/^\d+$/.test(String(sp).trim()))special=+String(sp).trim();arr.push({key:dateKey(d),date:d,numbers:nums,special,period:String(r[1]??'')});}
  arr.sort((a,b)=>b.date-a.date);if(three&&arr.length>MAX_WEEKS_THREE*5)arr=arr.slice(0,MAX_WEEKS_THREE*5);for(const x of arr)out.set(x.key,x);return out;
}
async function loadLocalCSV(forceFile){syncState();const file=forceFile||CFG[S.lottery].file;status('⚡ 正在讀取 GitHub CSV：'+file+'...');try{const r=await fetch('./'+file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();draws=parseCSVText(text,S.lottery,S.cutoff,S.threePeriodMode);if(!draws.size)throw new Error('沒有可辨識的開獎資料');const latest=[...draws.values()].sort((a,b)=>b.date-a.date)[0];status(`✅ 資料載入完成\n${CFG[S.lottery].name}｜${draws.size} 期｜最新 ${fmtDate(latest.date)}｜${file}`);showRecent();}catch(e){draws=new Map();status('❌ 載入失敗：'+e.message+'\n請確認 CSV 與 index.html 位於 GitHub 同一層。')}}
function relevantDates(cutoff=S.cutoff){return [...draws.values()].filter(x=>x.date<=cutoff&&S.weekdays.includes(dayIdx(x.date))).sort((a,b)=>b.date-a.date)}
function groupByWeek(){const weeks=new Map();const start=addDays(S.cutoff,-(S.threePeriodMode?MAX_WEEKS_THREE*20:MAX_WEEKS*7));for(const [k,x] of draws){if(x.date>S.cutoff)continue;if(!S.threePeriodMode&&x.date<start)continue;if(!S.weekdays.includes(dayIdx(x.date)))continue;const wd=dayIdx(x.date);const monday=addDays(x.date,-wd);const mk=dateKey(monday);if(!weeks.has(mk))weeks.set(mk,[]);weeks.get(mk).push(x)}return new Map([...weeks.entries()].sort((a,b)=>b[0].localeCompare(a[0])))}
function buildNumberPool(){const max=CFG[S.lottery].max;const counts=Array(max+1).fill(0);const dates=relevantDates();const use=S.threePeriodMode?dates.slice(0,MAX_WEEKS_THREE*4):dates.filter(x=>x.date>=addDays(S.cutoff,-MAX_WEEKS*7));use.forEach(x=>(x.numbers.concat(S.includeSpecial&&x.special?[x.special]:[])).forEach(n=>counts[n]++));const total=Math.max(1,use.length);return Array.from({length:max},(_,i)=>i+1).sort((a,b)=>counts[b]-counts[a]).slice(0,49)}
function historicalCombos(){const out=[];const seen=new Set();for(const x of relevantDates().slice(0,S.threePeriodMode?MAX_WEEKS_THREE*4:MAX_WEEKS*4)){const c=x.numbers.slice();if(S.includeSpecial&&x.special)c.push(x.special);const key=c.join(',');if(!seen.has(key)){seen.add(key);out.push(c)}}return out}
function comboHits(combo,draw){const nums=draw.numbers.concat(S.includeSpecial&&draw.special?[draw.special]:[]);if(S.lastDigitMode)return intersection(uniq(combo.map(n=>n%10)),uniq(nums.map(n=>n%10))).length;return intersection(combo,nums).length}
function starHits(combo,draw){let raw=comboHits(combo,draw);if(S.mode===1)return raw>=Math.min(...S.minStars)?raw:0;let start=0,valid=0;for(const c of S.columnConfig){if(c>0){const p=combo.slice(start,start+c);const pHit=S.lastDigitMode?intersection(uniq(p.map(n=>n%10)),uniq(draw.numbers.concat(S.includeSpecial&&draw.special?[draw.special]:[]).map(n=>n%10))).length:intersection(p,draw.numbers.concat(S.includeSpecial&&draw.special?[draw.special]:[])).length;if(pHit>0)valid++;start+=c}}let best=0;for(const s of [...S.minStars].sort((a,b)=>b-a))if(valid>=s&&raw>=s){best=s;break}return best}
function validGroups(){const d=relevantDates();if(!S.threePeriodMode){const weeks=groupByWeek();return [...weeks.entries()].map(([wk,arr])=>({start:fromDateKey(wk),dates:arr.sort((a,b)=>a.date-b.date)}))}
  const a=d.slice().reverse();const g=[];let i=0;while(i+3<=a.length){g.push(a.slice(i,i+3));i+=3+S.skipPeriods}return g.map(arr=>({start:arr[0]?.date||S.cutoff,dates:arr.slice().sort((a,b)=>a.date-b.date)}))}
function findRecentStreak(combo){const groups=validGroups();if(!groups.length)return {streak:0,total:0,detail:[],avg:0,max:0,sd:0};
  let consecutiveBad=0;for(const g of groups){const hits=g.dates.map(x=>starHits(combo,x));const meets=S.allPassMode?hits.every(h=>h>=Math.min(...S.minStars)):hits.some(h=>h>=Math.min(...S.minStars));const bad=missMode?meets:!meets;if(bad)consecutiveBad++;else break}
  const threshold=(S.breakPeriodMode?S.breakPeriods:0)+(S.latestMissMode?1:0);if(consecutiveBad<threshold)return {streak:0,total:0,detail:[],avg:0,max:0,sd:0};
  let streak=0,total=0,details=[],weekly=[];let interruption=0;
  for(let gi=0;gi<groups.length;gi++){
    const g=groups[gi],dailyHits={},dailyNums={},dailyDates={};let hitsList=[];
    for(const x of g.dates){let h=S.excludeToday&&dateKey(x.date)===dateKey(S.cutoff)?0:starHits(combo,x);dailyHits[dayIdx(x.date)]=h;dailyNums[dayIdx(x.date)]=S.lastDigitMode?uniq(x.numbers.concat(S.includeSpecial&&x.special?[x.special]:[]).filter(n=>uniq(combo.map(v=>v%10)).includes(n%10))).sort((a,b)=>a-b):intersection(combo,x.numbers.concat(S.includeSpecial&&x.special?[x.special]:[]));dailyDates[dayIdx(x.date)]=x.date;hitsList.push(h);total+=missMode?(h<Math.min(...S.minStars)?1:0):h}
    let meets=S.allPassMode?hitsList.length>0&&hitsList.every(h=>h>=Math.min(...S.minStars)):hitsList.some(h=>h>=Math.min(...S.minStars));if(missMode)meets=!meets;if(S.latestMissMode&&gi===0)meets=false;weekly.push(hitsList.length?Math.max(...hitsList):0);if(meets){streak++;interruption=0}else{interruption++;if(interruption>(S.breakPeriodMode?S.breakPeriods:0)&&!(S.latestMissMode&&gi===0))break}details.push({start:g.start,dailyHits,dailyNums,dailyDates});}
  const weights=groups.slice(0,6).map((_,i)=>1-.1*i);let weighted=0,wSum=0;for(let i=0;i<Math.min(6,groups.length);i++){const g=groups[i];const hs=g.dates.map(x=>S.excludeToday&&dateKey(x.date)===dateKey(S.cutoff)?0:starHits(combo,x));const wm=hs.length?Math.max(...hs):0;weighted+=wm*weights[i];wSum+=weights[i]}const avg=wSum?weighted/wSum:0;return {streak,total,detail:details,avg,max:weekly.length?Math.max(...weekly):0,sd:std(weekly)}
}
function formatCombo(c){if(S.lastDigitMode)return '['+uniq(c.map(n=>n%10)).sort((a,b)=>a-b).join(',')+']尾';if(S.mode===1)return c.map(n=>String(n).padStart(2,'0')).join(',');let out=[],s=0;for(const n of S.columnConfig){if(n>0){out.push('('+c.slice(s,s+n).map(v=>String(v).padStart(2,'0')).join(',')+')');s+=n}}return out.join('+')}
function initPopulation(pool,hist,count){if(S.consecutiveMode&&S.mode===1){const all=[];for(let st=1;st<=CFG[S.lottery].max-count+1;st++)all.push(Array.from({length:count},(_,i)=>st+i));return sample(all,Math.min(POPULATION_SIZE,all.length))}
  const pop=[];for(const c of hist.slice(0,Math.floor(POPULATION_SIZE*.2)))if(c.length===count&&uniq(c).length===count)pop.push(c.slice(0,count));let guard=0;while(pop.length<POPULATION_SIZE&&guard++<POPULATION_SIZE*70){let c;if(S.consecutiveMode&&S.mode===0){c=[];for(const z of S.columnConfig)if(z>0){const st=1+Math.floor(Math.random()*(CFG[S.lottery].max-z+1));c.push(...Array.from({length:z},(_,i)=>st+i))}}else c=Math.random()<.1?sample(Array.from({length:CFG[S.lottery].max},(_,i)=>i+1),count):sample(pool.length>=count?pool:Array.from({length:CFG[S.lottery].max},(_,i)=>i+1),count);if(uniq(c).length===count&&!pop.some(x=>x.join(',')===c.join(',')))pop.push(c)}return pop.length?pop:[Array.from({length:count},(_,i)=>i+1)]}
function tournament(scored){const a=sample(scored,Math.min(TOURNAMENT_SIZE,scored.length));return a.reduce((best,x)=>!best||x.fitness>best.fitness?x:best,null).combo.slice()}
function crossover(a,b,count){if(S.consecutiveMode&&S.mode===1){const st=+randomChoice([a[0],b[0]]);return Array.from({length:count},(_,i)=>Math.max(1,Math.min(CFG[S.lottery].max-count+1,st))+i)}const child=[],used=new Set();for(let i=0;i<count;i++){const cand=Math.random()<.5?a[i]:b[i];if(cand&&!used.has(cand)){child.push(cand);used.add(cand)}else{let n;do{n=1+Math.floor(Math.random()*CFG[S.lottery].max)}while(used.has(n));child.push(n);used.add(n)}}return child}
function mutationRate(gen,noImprove,improved){if(noImprove>=50&&!improved)return .20;return gen<200?.15:gen<400?.12:.10}
function eliteRate(gen){return gen<200?.15:gen<400?.12:.10}
function selectElite(scored,count){scored.sort((a,b)=>b.streak-a.streak||b.total-a.total||a.sd-b.sd);const e=[];for(const x of scored){if(e.length>=count)break;if(!e.length||Math.min(...e.map(y=>uniq(x.combo.concat(y.combo)).length-Math.min(x.combo.length,y.combo.length)))>=1)e.push(x.combo.slice())}return e}
function runOneGeneration(pool,hist,pop,count){let scored=[];const hot=new Map();const dates=relevantDates();const denom=Math.max(1,dates.length*CFG[S.lottery].balls);const cnt=new Map();dates.forEach(x=>x.numbers.concat(S.includeSpecial&&x.special?[x.special]:[]).forEach(n=>cnt.set(n,(cnt.get(n)||0)+1)));for(const c of pop){if(uniq(c).length!==c.length)continue;const m=findRecentStreak(c);const hotScore=c.reduce((s,n)=>s+(cnt.get(n)||0)/denom,0)/c.length;const sw=missMode?.60:(m.streak<STREAK_THRESHOLD?.50:.60);const tw=missMode?.30:(m.streak<STREAK_THRESHOLD?.40:.30);const avgW=missMode?-.05:.05,hotW=missMode?-.03:.03;const fit=sw*m.streak+tw*Math.min(m.total,Math.min(...S.minStars)*(S.threePeriodMode?MAX_WEEKS_THREE:MAX_WEEKS))+avgW*Math.min(m.avg,Math.min(...S.minStars))+hotW*hotScore-.01*m.sd;scored.push({fitness:fit,streak:m.streak,total:m.total,sd:m.sd,max:m.max,hot:hotScore,detail:m.detail,combo:c.slice()})}if(!scored.length)return null;scored.sort((a,b)=>b.streak-a.streak||b.total-a.total||a.sd-b.sd);const top=scored[0];const ns=[-top.streak,missMode?top.total:-top.total,top.sd];if(ns[0]<bestScore[0]||ns[0]===bestScore[0]&&ns[1]<bestScore[1]||ns[0]===bestScore[0]&&ns[1]===bestScore[1]&&ns[2]<bestScore[2]){bestScore=ns;globalBestCombo=top.combo.slice();globalBestDetail=top.detail;bestColumnConfig=S.columnConfig.slice();resetCount=resetCount;}
  generation++;return {scored,top};}
async function runAnalysis(isMiss=false,timeoutSec=null){syncState();if(!draws.size){output('請先載入資料');return}missMode=isMiss;isRunning=true;runToken++;const token=runToken;generation=0;resetCount=0;bestScore=[-1,-Infinity,Infinity];globalBestCombo=null;globalBestDetail=[];bestColumnConfig=S.columnConfig.slice();disableButtons(true);const start=performance.now();const pool=buildNumberPool(),hist=historicalCombos(),count=S.mode===1?S.numNumbers:S.columnConfig.filter(x=>x>0).reduce((a,b)=>a+b,0);let pop=initPopulation(pool,hist,count),noImp=0,improved=true;
  output(`正在進行${isMiss?'不出':''}分析...\n資料期數：${relevantDates().length}\n號碼池：${pool.length}\n模式：${S.mode===1?'輪碰':'立柱'}｜${formatSettings()}`);
  while(isRunning&&token===runToken){const before=bestScore.slice();const r=runOneGeneration(pool,hist,pop,count);if(!r)break;let same=before[0]===bestScore[0]&&before[1]===bestScore[1]&&before[2]===bestScore[2];noImp=same?noImp+1:0;improved=!same;const mut=mutationRate(generation,noImp,improved);const elites=selectElite(r.scored,Math.max(1,Math.floor(POPULATION_SIZE*eliteRate(generation))));const np=elites.map(x=>x.slice());while(np.length<POPULATION_SIZE){let child=crossover(tournament(r.scored),tournament(r.scored),count);if(S.consecutiveMode){if(Math.random()<mut){let shift=Math.floor(Math.random()*11)-5;if(S.mode===0){let outc=[],s=0;for(const z of S.columnConfig){if(z>0){let p=child.slice(s,s+z);if(p.length>1&&p.every((v,i)=>v===p[0]+i)){let st=Math.max(1,Math.min(CFG[S.lottery].max-z+1,p[0]+shift));outc.push(...Array.from({length:z},(_,i)=>st+i))}else outc.push(...p);s+=z}}child=outc}}else{for(let i=0;i<child.length;i++)if(Math.random()<mut){const av=pool.filter(n=>!child.includes(n));if(av.length)child[i]=randomChoice(av)}}if(uniq(child).length===child.length)np.push(child)}pop=np.slice(0,POPULATION_SIZE);
    const elapsed=(performance.now()-start)/1000;const streak=missMode?bestScore[0]:(-bestScore[0]||0),total=missMode?bestScore[1]:(-bestScore[1]||0);$('progress').textContent=`🔄第${resetCount}次｜運算:${generation}｜最佳${missMode?'連續不中':'連續過關'}:${streak}｜總${missMode?'不中次數':'星數'}:${total.toFixed(1)}｜推薦:${globalBestCombo?formatCombo(globalBestCombo):''}`;
    if(globalBestCombo)output(`🏎️運算:${generation} 🏆最佳${missMode?'連續不中':'連續過關'}:${streak} ⭐總${missMode?'不中次數':'星數'}:${total.toFixed(1)} 📊標準差:${bestScore[2].toFixed(2)}\n樂透類型:${CFG[S.lottery].name}\n最低中星數:${S.minStars.join(', ')}\n推薦${missMode?'不出':''}${S.mode===1?'號碼':'立柱'}(第一名🥇):${formatCombo(globalBestCombo)}\n\n${formatSettings()}`);
    if(noImp>=NO_IMPROVEMENT_LIMIT||generation>=MAX_GENERATIONS_TO_RUN){resetCount++;pop=initPopulation(pool,hist,count);noImp=0;generation=0}
    if(timeoutSec&&elapsed>=timeoutSec)break;
    await new Promise(res=>setTimeout(res,0));
  }
  isRunning=false;disableButtons(false);if(globalBestCombo){output(buildFinalOutput()) ; drawChartFor(globalBestCombo,globalBestDetail)}
}
function formatSettings(){return `截止:${fmtDate(S.cutoff)}｜星期:${S.weekdays.map(x=>WEEK[x]).join('、')}｜最低:${S.minStars.join('/')}星｜特別號:${S.includeSpecial?'是':'否'}｜全過關:${S.allPassMode?'是':'否'}｜到期:${S.latestMissMode?'是':'否'}｜3期中一次:${S.threePeriodMode?'是':'否'}｜空幾期:${S.skipPeriods}｜斷幾期:${S.breakPeriodMode?S.breakPeriods:0}｜排除當天:${S.excludeToday?'是':'否'}｜連號:${S.consecutiveMode?'是':'否'}｜尾數:${S.lastDigitMode?'是':'否'}`}
function buildFinalOutput(){const modeLabel=missMode?'連續不中':'連續過關';const streak=missMode?bestScore[0]:-bestScore[0],total=missMode?bestScore[1]:-bestScore[1];const out=[`✅ 分析完成｜${CFG[S.lottery].name}`,formatSettings(),`最佳${modeLabel}:${streak}`,`總${missMode?'不中次數':'星數'}:${total.toFixed(1)}`,globalBestCombo?`\n推薦${missMode?'不出':''}${S.mode===1?'號碼':'立柱'}(第一名🥇):${formatCombo(globalBestCombo)}`:''];if(S.latestMissMode&&globalBestCombo){const need=Math.max(1,S.weekdays.length-1),past=relevantDates().filter(x=>x.date<S.cutoff).slice(0,need);if(past.length>=need){const hs=past.map(x=>starHits(globalBestCombo,x));out.push(`🔍 盤勢:${hs.every(h=>h<Math.min(...S.minStars))?'⚠️【到期機會】':'(非到期盤)'}｜前${need}期:`+past.map((x,i)=>`${fmtDate(x.date).slice(5)}(${hs[i]})`).join(' '))}}}
  out.push('\n分析詳情:');globalBestDetail.forEach((g,i)=>{out.push(`\n${S.threePeriodMode?'組 '+(i+1)+': '+fmtDate(g.start):fmtDate(g.start)}`);for(const wd of Object.keys(g.dailyHits||{}).sort((a,b)=>+a-+b)){const h=g.dailyHits[wd],n=(g.dailyNums[wd]||[]).map(v=>String(v).padStart(2,'0')).join(',');const mark=(h>=Math.min(...S.minStars)?'🌟':'❌')+(S.latestMissMode&&i===0?' ⬅️預測到期':'');out.push(`  ${WEEK[+wd]} 星數:${String(h).padStart(2,' ')}${mark} 號碼:${n} (${fmtDate(g.dailyDates[wd])})`)}});return out.join('\n')}
function disableButtons(on){['analyze','missAnalyze','update','recent','chart','backtest','history','downloadChart'].forEach(id=>$(id).disabled=on);$('stop').disabled=!on}
function stopRun() {isRunning=false;runToken++;$('progress').textContent='⏹️ 已中止；保留目前最佳結果。';if(globalBestCombo)output('分析已中止，顯示當前最佳結果\n\n'+buildFinalOutput())}
function showRecent(){syncState();const arr=relevantDates().slice(0,10);$('tableTitle').textContent='近10期開獎';$('tableWrap').innerHTML='<table><thead><tr><th>日期</th><th>期號</th><th>開獎號碼</th></tr></thead><tbody>'+arr.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.period)}</td><td>${balls(x.numbers,x.special)}</td></tr>`).join('')+'</tbody></table>'}
function balls(ns,sp){let a=ns.slice().sort((x,y)=>x-y).map(n=>`<span class="ball">${String(n).padStart(2,'0')}</span>`);if(S.includeSpecial&&sp!=null)a.push(`<span class="ball special">${String(sp).padStart(2,'0')}</span>`);return a.join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showDataTable(data,title){$('tableTitle').textContent=title;$('tableWrap').innerHTML='<table><thead><tr><th>日期</th><th>期號</th><th>號碼</th></tr></thead><tbody>'+data.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.period)}</td><td>${balls(x.numbers,x.special)}</td></tr>`).join('')+'</tbody></table>'}
function buildChartData(combo,detail,targets=[]){return {combo,detail,targets};}
function drawChartFor(combo,detail,targetDates=[]){syncState();const c=$('chartCanvas'),ctx=c.getContext('2d');const dates=[...draws.values()].filter(x=>x.date<=S.cutoff).sort((a,b)=>a.date-b.date).slice(-CHART_DISPLAY_LIMIT);const fill=(CHART_ROWS*CHART_COLS)-dates.length;let dts=dates.slice();if(fill>0&&dts.length){let x=dts.at(-1).date,i=0;while(i<fill){x=addDays(x,1);if(CFG[S.lottery].valid.includes(dayIdx(x))){dts.push({date:x,key:dateKey(x),numbers:[],special:null});i++}}}c.width=1200;c.height=Math.max(600,60+Math.ceil(dts.length/CHART_COLS)*26);ctx.clearRect(0,0,c.width,c.height);ctx.font='12px -apple-system,sans-serif';const colW=c.width/CHART_COLS,rowH=26;const targetSet=new Set(targetDates.map(x=>x instanceof Date?dateKey(x):String(x)));let flat=Array.from({length:CHART_COLS},()=>[]);dts.forEach((x,i)=>flat[i%CHART_COLS].push(x));for(let col=0;col<CHART_COLS;col++){const baseX=col*colW;ctx.fillStyle='#ffff00';ctx.fillRect(baseX,0,colW,32);ctx.strokeStyle='#111';ctx.strokeRect(baseX,0,colW,32);ctx.fillStyle='#111';ctx.textAlign='center';ctx.fillText('月   日   週   '+CFG[S.lottery].name,baseX+colW/2,20);flat[col].forEach((x,r)=>{const y=32+r*rowH;let bg='#fff';if(targetSet.has(x.key))bg='#d0eaff';else if(detail.some(g=>(g.dailyDates&&Object.values(g.dailyDates).some(dt=>dateKey(dt)===x.key))))bg=r%2?'#ffffcc':'#ccffcc';ctx.fillStyle=bg;ctx.fillRect(baseX,y,colW,rowH);ctx.strokeStyle='#ddd';ctx.strokeRect(baseX,y,colW,rowH);ctx.fillStyle='#1f4e79';ctx.fillText(String(x.date.getMonth()+1),baseX+20,y+17);ctx.fillStyle='#111';ctx.fillText(String(x.date.getDate()).padStart(2,'0'),baseX+56,y+17);ctx.fillText(WEEK[dayIdx(x.date)].replace('週',''),baseX+88,y+17);if(draws.has(x.key)){const real=draws.get(x.key);ctx.fillStyle='#1f4e79';ctx.textAlign='center';ctx.fillText(real.numbers.slice().sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0')).join(' '),baseX+colW/2+45,y+17);if(S.includeSpecial&&real.special){ctx.fillStyle='#dc3545';ctx.fillText('S'+String(real.special).padStart(2,'0'),baseX+colW-28,y+17)}}let g=detail.find(z=>z.dailyDates&&Object.values(z.dailyDates).some(dt=>dateKey(dt)===x.key));if(g){const wd=Object.keys(g.dailyDates||{}).find(k=>dateKey(g.dailyDates[k])===x.key);const hits=g.dailyHits[wd]||0;if(hits>0){ctx.fillStyle='#0000ff';ctx.beginPath();ctx.arc(baseX+colW-10,y+13,4,0,Math.PI*2);ctx.fill()}}});ctx.textAlign='left'}lastChartPayload=buildChartData(combo,detail,targetDates)}
function downloadChart(){const a=document.createElement('a');a.download=`${CFG[S.lottery].name}_版路分析.png`;a.href=$('chartCanvas').toDataURL('image/png');a.click()}
function historyRender(){const box=$('historyBox');if(!backtestHistory.length){box.textContent='尚無回測紀錄';return}box.innerHTML=backtestHistory.map((x,i)=>`<div class="history-item"><strong>第${x.round}輪｜${x.date}｜${x.success?'⭕️成功':'❌失敗'}</strong><br>推薦：${esc(x.comboText)}<br>驗證：${esc(x.hitInfo||'尚未開獎')}<br><button onclick="showHistoryChart(${i})">查看本輪版路</button></div>`).join('')}
function showHistoryChart(i){const x=backtestHistory[i];drawChartFor(x.combo,x.detail,x.checkGroup||[]);output(`📜 第${x.round}輪版路\n日期:${x.date}\n推薦:${x.comboText}\n驗證:${x.hitInfo}`)}
async function runBacktest(){syncState();if(isRunning)return;if(!draws.size){output('無資料可回測');return}const sec=Math.max(1,parseInt($('btSeconds').value||'2',10));const all=relevantDates().slice().reverse();let targets;if(S.threePeriodMode){targets=all.slice(0,Math.min(30,Math.max(0,all.length-3)))}else{targets=all.slice(0,Math.min(30,Math.max(0,all.length-S.weekdays.length-1)))}backtestHistory=[];historyRender();isRunning=true;disableButtons(true);output(`🚀 初始化自動回測系統｜每輪 ${sec} 秒\n設定：${S.excludeToday?'排除當天':'包含當天'}\n回測輪數：${targets.length}\n`);for(let i=0;i<targets.length&&isRunning;i++){S.cutoff=targets[i].date;$('cutoff').value=fmtDate(S.cutoff);const token=runToken;missMode=missMode;bestScore=[-1,-Infinity,Infinity];globalBestCombo=null;globalBestDetail=[];generation=0;const pool=buildNumberPool(),hist=historicalCombos(),count=S.mode===1?S.numNumbers:S.columnConfig.filter(x=>x>0).reduce((a,b)=>a+b,0);let pop=initPopulation(pool,hist,count),start=performance.now(),noImp=0;while(performance.now()-start<sec*1000&&isRunning){const before=bestScore.slice(),r=runOneGeneration(pool,hist,pop,count);if(!r)break;noImp=(before[0]===bestScore[0]&&before[1]===bestScore[1]&&before[2]===bestScore[2])?noImp+1:0;const mut=mutationRate(generation,noImp,true),np=selectElite(r.scored,Math.max(1,Math.floor(POPULATION_SIZE*eliteRate(generation))));while(np.length<POPULATION_SIZE){let ch=crossover(tournament(r.scored),tournament(r.scored),count);for(let j=0;j<ch.length;j++)if(!S.consecutiveMode&&Math.random()<mut){const av=pool.filter(n=>!ch.includes(n));if(av.length)ch[j]=randomChoice(av)}if(uniq(ch).length===ch.length)np.push(ch)}pop=np.slice(0,POPULATION_SIZE);await new Promise(r=>setTimeout(r,0))}
      if(!globalBestCombo)continue;const target=targets[i];const dates=verifyDates(target.date);let success=false,maxH=0,marks=[];for(const d of dates){const dd=draws.get(dateKey(d));if(!dd){marks.push(`${fmtDate(d).slice(5)}(?)`);continue}const h=starHits(globalBestCombo,dd);maxH=Math.max(maxH,h);marks.push(`${fmtDate(d).slice(5)}(${h})`)}success=maxH>=Math.min(...S.minStars);if(missMode)success=!success;const item={round:i+1,date:fmtDate(target.date),success,combo:globalBestCombo.slice(),comboText:formatCombo(globalBestCombo),hitInfo:marks.join(' '),detail:globalBestDetail,checkGroup:dates};backtestHistory.push(item);historyRender();output($('output').textContent+`\n--------[第 ${i+1}/${targets.length} 輪]--------\n📅 基準日:${fmtDate(target.date)} ${WEEK[dayIdx(target.date)]}\n📌 推薦:${item.comboText}\n🎯 驗證:${maxH}星 ${success?'⭕️':'❌'} [${item.hitInfo}]\n`);$('progress').textContent=`🧪 回測 ${i+1}/${targets.length}｜推薦:${item.comboText}｜驗證:${success?'成功':'失敗'}`}
isRunning=false;disableButtons(false);if(backtestHistory.length){const last=backtestHistory.at(-1);drawChartFor(last.combo,last.detail,last.checkGroup)} }
function verifyDates(target){const asc=relevantDates().slice().sort((a,b)=>a.date-b.date).map(x=>x.date);const idx=asc.findIndex(d=>dateKey(d)===dateKey(target));if(idx<0)return[];if(S.threePeriodMode){if(S.latestMissMode)return asc.slice(Math.max(0,idx-2),idx+1);const st=idx+1+S.skipPeriods*3;return asc.slice(st,st+3)}const days=Math.max(1,S.weekdays.length);if(S.latestMissMode&&S.excludeToday){const need=Math.max(1,S.weekdays.length-1);return asc.slice(Math.max(0,idx-need),idx+1)}return asc.slice(idx+1,idx+1+days)}
$('lottery').onchange=()=>{S.lottery=+$('lottery').value;S.weekdays=CFG[S.lottery].defaults.slice();S.numNumbers=CFG[S.lottery].balls===7?6:5;$('numNumbers').value=S.numNumbers;renderStars();renderWeekdays();updateModeUI();loadLocalCSV()};
$('mode').onchange=()=>{S.mode=+$('mode').value;updateModeUI()};$('threePeriod').onchange=()=>syncState();$('breakMode').onchange=()=>syncState();$('analyze').onclick=()=>runAnalysis(false);$('missAnalyze').onclick=()=>runAnalysis(true);$('stop').onclick=stopRun;$('update').onclick=()=>loadLocalCSV();$('recent').onclick=showRecent;$('chart').onclick=()=>globalBestCombo?drawChartFor(globalBestCombo,globalBestDetail):output('目前沒有可繪製的分析結果');$('downloadChart').onclick=downloadChart;$('backtest').onclick=runBacktest;$('history').onclick=()=>{historyRender();$('historyBox').scrollIntoView({behavior:'smooth'})};window.addEventListener('beforeunload',()=>{isRunning=false});
setUiDefaults();loadLocalCSV();
